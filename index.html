<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FamilyConnect">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>FamilyConnect</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'media' }</script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fastAction = urlParams.get('action');
        if (fastAction === 'shortcut' || fastAction === 'add_shopping') {
            window.isFastMode = true;
            document.addEventListener("DOMContentLoaded", async () => {
                document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#fff;font-family:sans-serif;font-size:20px;font-weight:bold;">Verarbeite...</div>';
                try {
                    const cfgStr = urlParams.get('cfg');
                    if (!cfgStr) throw new Error("No config");
                    const config = JSON.parse(decodeURIComponent(escape(atob(cfgStr))));
                    const finalConfig = config.firebaseConfig ? config.firebaseConfig : config;

                    firebase.initializeApp(finalConfig);
                    const db = firebase.firestore();
                    await firebase.auth().signInAnonymously();

                    const fid = urlParams.get('fid');
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-connect-pro';
                    const docRef = db.doc(`artifacts/${appId}/public/data/families/${fid}`);
                    const docSnap = await docRef.get();

                    if (!docSnap.exists) throw new Error("Family not found");
                    const data = docSnap.data();

                    if (fastAction === 'shortcut') {
                        const reasonId = urlParams.get('reason');
                        const REASONS = {
                            'general_meal': { sentence: 'Das Essen ist fertig!', category: 'meal' },
                            'breakfast': { sentence: 'Das Frühstück ist fertig!', category: 'meal' },
                            'lunch': { sentence: 'Das Mittagessen ist fertig!', category: 'meal' },
                            'coffee': { sentence: 'Es gibt Kaffee und Kuchen!', category: 'meal' },
                            'dinner': { sentence: 'Das Abendessen ist fertig!', category: 'meal' },
                            'table': { sentence: 'Hilfe beim Tischdecken wird benötigt!', category: 'push_only' },
                            'message': { sentence: 'Bitte komme ins Wohnzimmer!', category: 'other' },
                            'movie': { sentence: 'Der Film fängt gleich an!', category: 'other' },
                            'game': { sentence: 'Wir wollen spielen, komm dazu!', category: 'other' }
                        };
                        const rObj = REASONS[reasonId] || { sentence: 'Ruf über Kurzbefehl!', category: 'other' };

                        const now = new Date();
                        const isNightMode = now.getHours() >= 22 || now.getHours() < 7;
                        const actualTargets = [];
                        const fetchPromises = [];

                        (data.members || []).forEach(m => {
                            if (m && m.status !== 'pending') {
                                const isDND = m.dndUntil && new Date(m.dndUntil) > now;
                                if (!isDND) {
                                    actualTargets.push(m.name);
                                    if (!isNightMode && rObj.category !== 'push_only') {
                                        const u = rObj.category === 'meal' ? m.voiceMonkeyMeal : m.voiceMonkeyOther;
                                        if (u && u.trim()) fetchPromises.push(fetch(u).catch(() => { }));
                                    }
                                }
                            }
                        });

                        if (actualTargets.length > 0) {
                            const isExpired = (ts) => { if (!ts) return true; const t = new Date(ts).getTime(); return isNaN(t) ? true : (Date.now() - t) > 5 * 60 * 1000; };
                            const cleanHistory = (data.history || []).filter(h => h.isExpense || h.isHousehold || h.isSystemReminder || h.isCustomPush || h.isSwapRequest || h.isSuccessfulSwap || h.isRejectedSwap || h.isPaymentVerification || h.isSettlement || !isExpired(h.timestamp)).slice(0, 50);
                            const newHistoryItem = { id: Date.now().toString(), timestamp: now.toISOString(), sender: 'Extern', reason: rObj.sentence, targets: actualTargets, acknowledgedBy: [], isExpense: false, isResend: false, category: rObj.category, isCustomPush: true };

                            await docRef.update({ history: [newHistoryItem, ...cleanHistory] });
                            await Promise.all(fetchPromises);

                            document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#34C759;font-family:sans-serif;font-size:22px;font-weight:bold;">Erfolgreich gesendet! ✅</div>';
                        } else {
                            document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#FF9500;font-family:sans-serif;font-size:22px;font-weight:bold;">Alle im Nicht-Stören Modus 🔕</div>';
                        }
                    }
                    else if (fastAction === 'add_shopping') {
                        const itemsParam = urlParams.get('items');
                        if (!itemsParam) throw new Error("No items");
                        const listNameParam = urlParams.get('listName');
                        const userParam = urlParams.get('user');

                        const getCat = (l) => {
                            if (/scheuer|spül|wasch|seife|klo|papier|tuch|shampoo|deo|zahnpasta|müll|putz|creme|dusch|rasier|bürste|schwamm|reiniger|watte|windel|slipeinlage|tampon|binde|rolle|wc|lotion|pflegetücher|waschmittel|klobürste|zahnseide|hygiene/i.test(l)) return 'Haushalt & Drogerie';
                            if (/apfel|äpfel|banan|tomate|gurke|obst|gemüse|salat|zwiebel|kartoffel|knoblauch|beere|traube|paprika|möhre|karotte|pilz|zitrone|orange|birne|birnen|pflaume|melone|kiwi|kürbis|lauch|sellerie|brokkoli|zucchini|apfelsine|mandarine|pfirsich|nektarine|kirsche|avocado|aubergine|spinat|kohl|linsen|bohne|erbse|mais|ananas|mango|spargel|ingwer|kräuter|petersilie|basilikum/i.test(l)) return 'Obst & Gemüse';
                            if (/brot|brötchen|eier|kuchen|mehl|zucker|hefe|toast|croissant|brezel|baguette|backpulver|torte|teig|vanillezucker|pfannkuchen|waffel|breze|\bei\b/i.test(l)) return 'Eier & Backwaren';
                            if (/milch|käse|quark|joghurt|butter|sahne|frischkäse|mozzarella|feta|gouda|pudding|margarine|parmesan|creme fraiche|emmentaler|camembert|mascarpone|ricotta|schmand|eiweiß/i.test(l)) return 'Kühlregal & Käse';
                            if (/wurst|fleisch|schinken|salami|hack|hähnchen|speck|schnitzel|steak|aufschnitt|pute|rind|schwein|lamm|bratwurst|würstchen|fisch|lachs|thunfisch|garnele|cevapcici|kaviar|sushi|forelle/i.test(l)) return 'Fleisch & Fisch';
                            if (/nudel|reis|ketchup|senf|soße|sosse|dose|müsli|haferflocken|öl|oel|essig|gewürz|salz|pfeffer|konserve|pesto|tomaten|suppe|brühe|honig|marmelade|nutella|aufstrich|mayo|sirup|chia|samen|kerne|maggi/i.test(l)) return 'Vorrat & Nährmittel';
                            if (/chips|schoko|keks|eis|süß|gummibär|nuss|riegel|popcorn|flips|nachos|praline|bonbon|kaugummi|mandel|cashew|pistazie|haribo|snickers|twix|mars/i.test(l)) return 'Snacks & Süßes';
                            if (/wasser|bier|wein|cola|saft|limo|kaffee|tee|sprudel|schorle|getränk|energy|sekt|sprit|fanta|sprite/i.test(l)) return 'Getränke';
                            return 'Sonstiges';
                        };

                        const rawLines = decodeURIComponent(itemsParam).split('\n');
                        const newItems = [];
                        const tUser = userParam ? decodeURIComponent(userParam).trim() : 'KI Scanner';
                        const generateId = () => Math.floor(100000 + Math.random() * 900000).toString();

                        rawLines.forEach(line => {
                            let t = line.replace(/^[-*•]\s*/, '').replace(/^\d+[\.)]\s+/, '').trim();
                            if (t) {
                                let itemName = t;
                                let itemAmount = '';
                                
                                const trailMatch = t.match(/\s+(\d+(?:[.,]\d+)?)\s*(x|kg|g|l|ml|pkg|pack|packung|stk|stück|flaschen|flasche|dosen|dose)?$/i);
                                const leadMatch = t.match(/^(\d+(?:[.,]\d+)?)\s*(x|kg|g|l|ml|pkg|pack|packung|stk|stück|flaschen|flasche|dosen|dose)?\s+(.+)$/i);
                                
                                if (trailMatch) {
                                    itemName = t.substring(0, t.length - trailMatch[0].length).trim();
                                    itemAmount = `${trailMatch[1]} ${trailMatch[2] || ''}`.trim();
                                } else if (leadMatch) {
                                    itemName = leadMatch[3].trim();
                                    itemAmount = `${leadMatch[1]} ${leadMatch[2] || ''}`.trim();
                                }
                                
                                newItems.push({ id: generateId(), name: itemName, amount: itemAmount, notes: '', category: getCat(itemName.toLowerCase()), addedBy: tUser, checked: false, timestamp: new Date().toISOString() });
                            }
                        });

                        if (newItems.length > 0) {
                            let lists = data.shoppingLists || [];
                            const tName = listNameParam ? decodeURIComponent(listNameParam).trim() : 'Einkauf (KI)';
                            let targetList = lists.find(l => l.name.trim().toLowerCase() === tName.toLowerCase());

                            if (!targetList) {
                                targetList = { id: generateId(), name: tName, sharedWith: [tUser], createdBy: tUser, items: [], isShoppingActive: false, timestamp: new Date().toISOString() };
                                lists.push(targetList);
                            }
                            targetList.items = [...(targetList.items || []), ...newItems];
                            await docRef.update({ shoppingLists: lists });
                            document.body.innerHTML = `<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#34C759;font-family:sans-serif;font-size:22px;font-weight:bold;">${newItems.length} Artikel importiert! 🛒✅</div>`;
                        } else {
                            document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#FF3B30;font-family:sans-serif;font-size:22px;font-weight:bold;">Keine Artikel gefunden ❌</div>';
                        }
                    }
                } catch (e) {
                    document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#FF3B30;font-family:sans-serif;font-size:22px;font-weight:bold;">Verbindungsfehler ❌</div>';
                }
                setTimeout(() => {
                    if (window.webkit && window.webkit.messageHandlers) window.webkit.messageHandlers.close.postMessage("");
                    window.close();
                }, 1500);
            });
        }
    </script>

    <style>
        :root { --app-bg: #F2F2F7; }
        @media(prefers-color-scheme:dark) { :root { --app-bg: #000000; } }
        html { background-color: var(--app-bg); height: 100vh; width: 100vw; overflow: hidden; }
        body { margin: 0; padding: 0; background-color: var(--app-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior-y: none; height: 100%; width: 100%; }
        .scrollable-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(120px + env(safe-area-inset-bottom, 20px)); }
        .scrollable-area::-webkit-scrollbar { display: none; }
        .ios-blur { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        @media(prefers-color-scheme:dark) { .ios-blur { background: rgba(28, 28, 30, 0.85); } }
        .pt-safe-top { padding-top: max(env(safe-area-inset-top), 24px); }
        input[type="file"] { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="datetime-local"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
        input[type="datetime-local"] { max-width: 100%; box-sizing: border-box; display: block; width: 100%; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-action-sheet { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .custom-checkbox:checked+div { background-color: #34C759; border-color: #34C759; }
        .custom-checkbox:checked+div svg { opacity: 1; }
        /* Switch */
        .toggle-checkbox:checked { right: 0; border-color: #34C759; }
        .toggle-checkbox:checked + .toggle-label { background-color: #34C759; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); border-color: white; }
    </style>
</head>

<body class="text-black dark:text-white antialiased flex justify-center w-full">
    <div id="root" class="w-full h-full relative flex flex-col"></div>

    <script type="text/babel">
        const STYLES = {
            card: "bg-white dark:bg-[#1C1C1E] rounded-[24px] shadow-sm border border-[#E5E5EA] dark:border-[#38383A] overflow-hidden",
            input: "w-full bg-[var(--app-bg)] dark:bg-[#2C2C2E] px-4 py-3.5 rounded-[12px] outline-none font-medium text-[16px] text-black dark:text-white box-border focus:ring-2 ring-[#007AFF]/20",
            btnPrimary: "w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm disabled:opacity-50",
            btnSecondary: "w-full py-3.5 rounded-[16px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-black dark:text-white font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm disabled:opacity-50",
            btnDanger: "w-full py-3.5 rounded-[16px] bg-[#FF3B30]/10 text-[#FF3B30] font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm disabled:opacity-50",
            modalOverlay: "fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 pb-8 sm:pb-4 bg-black/40 dark:bg-black/60 backdrop-blur-sm transition-opacity animate-in fade-in duration-300",
            modalContent: "bg-white dark:bg-[#1C1C1E] rounded-[32px] p-6 w-full max-w-sm shadow-2xl border border-[#E5E5EA] dark:border-[#38383A] overflow-hidden animate-action-sheet relative flex flex-col max-h-[90vh]",
            subTitle: "text-[13px] font-semibold text-[#8E8E93] uppercase tracking-widest mb-2 ml-2",
            listItem: "flex items-center justify-between bg-[var(--app-bg)] dark:bg-[#2C2C2E] p-3.5 rounded-[14px]"
        };

        const SHOPPING_CATEGORIES = ['Obst & Gemüse', 'Eier & Backwaren', 'Kühlregal & Käse', 'Fleisch & Fisch', 'Vorrat & Nährmittel', 'Snacks & Süßes', 'Haushalt & Drogerie', 'Getränke', 'Sonstiges'];
        
        const ALL_MODULES = {
            'shopping': { id: 'shopping', icon: 'ShoppingCart', label: 'Planung' },
            'household': { id: 'household', icon: 'Home', label: 'Haushalt' },
            'expenses': { id: 'expenses', icon: 'Euro', label: 'Auslagen' },
            'gifts': { id: 'gifts', icon: 'Gift', label: 'Geschenke' }
        };

        function getAutoCategory(i) {
            const l = i.toLowerCase();
            if (/scheuer|spül|wasch|seife|klo|papier|tuch|shampoo|deo|zahnpasta|müll|putz|creme|dusch|rasier|bürste|schwamm|reiniger|watte|windel|slipeinlage|tampon|binde|rolle|wc|lotion|pflegetücher|waschmittel|klobürste|zahnseide|hygiene/i.test(l)) return 'Haushalt & Drogerie';
            if (/apfel|äpfel|banan|tomate|gurke|obst|gemüse|salat|zwiebel|kartoffel|knoblauch|beere|traube|paprika|möhre|karotte|pilz|zitrone|orange|birne|birnen|pflaume|melone|kiwi|kürbis|lauch|sellerie|brokkoli|zucchini|apfelsine|mandarine|pfirsich|nektarine|kirsche|avocado|aubergine|spinat|kohl|linsen|bohne|erbse|mais|ananas|mango|spargel|ingwer|kräuter|petersilie|basilikum/i.test(l)) return 'Obst & Gemüse';
            if (/brot|brötchen|eier|kuchen|mehl|zucker|hefe|toast|croissant|brezel|baguette|backpulver|torte|teig|vanillezucker|pfannkuchen|waffel|breze|\bei\b/i.test(l)) return 'Eier & Backwaren';
            if (/milch|käse|quark|joghurt|butter|sahne|frischkäse|mozzarella|feta|gouda|pudding|margarine|parmesan|creme fraiche|emmentaler|camembert|mascarpone|ricotta|schmand|eiweiß/i.test(l)) return 'Kühlregal & Käse';
            if (/wurst|fleisch|schinken|salami|hack|hähnchen|speck|schnitzel|steak|aufschnitt|pute|rind|schwein|lamm|bratwurst|würstchen|fisch|lachs|thunfisch|garnele|cevapcici|kaviar|sushi|forelle/i.test(l)) return 'Fleisch & Fisch';
            if (/nudel|reis|ketchup|senf|soße|sosse|dose|müsli|haferflocken|öl|oel|essig|gewürz|salz|pfeffer|konserve|pesto|tomaten|suppe|brühe|honig|marmelade|nutella|aufstrich|mayo|sirup|chia|samen|kerne|maggi/i.test(l)) return 'Vorrat & Nährmittel';
            if (/chips|schoko|keks|eis|süß|gummibär|nuss|riegel|popcorn|flips|nachos|praline|bonbon|kaugummi|mandel|cashew|pistazie|haribo|snickers|twix|mars/i.test(l)) return 'Snacks & Süßes';
            if (/wasser|bier|wein|cola|saft|limo|kaffee|tee|sprudel|schorle|getränk|energy|sekt|sprit|fanta|sprite/i.test(l)) return 'Getränke';
            return 'Sonstiges';
        }
        function generateId() { return Math.floor(100000 + Math.random() * 900000).toString(); }
        function getLocalTodayString() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
        function getLocalIsoString(addHours) { const d = new Date(); d.setHours(d.getHours() + addHours); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
        function formatTime(ts) { if (!ts) return ''; const d = new Date(ts); return isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        function formatDate(ts) { if (!ts) return ''; const d = new Date(ts); return isNaN(d.getTime()) ? '' : d.toLocaleDateString('de-DE', { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit' }); }
        function getStatusColor(a) {
            if (!a) return 'text-[#8E8E93] dark:text-[#EBEBF5]/60';
            if (a.includes('sofort') || a.includes('Übernommen') || a.includes('Gelesen') || a.includes('Zugefügt') || a.includes('Bin dabei')) return 'text-[#34C759]';
            if (a.includes('5 Minuten')) return 'text-[#FF9500]';
            if (a.includes('Fangt') || a.includes('Abgelehnt')) return 'text-[#FF3B30]';
            return 'text-[#34C759]';
        }
        function isExpired(ts, mx = 5) { if (!ts) return true; const t = new Date(ts).getTime(); if (isNaN(t)) return true; return (Date.now() - t) > mx * 60 * 1000; }
        function getCleanHistory(hist) { return (hist || []).filter(h => { if (h.isExpense || h.isHousehold || h.isSystemReminder || h.isCustomPush || h.isSwapRequest || h.isSuccessfulSwap || h.isRejectedSwap || h.isPaymentVerification || h.isSettlement || h.isGiftInvite) return true; return !isExpired(h.timestamp, 5); }).slice(0, 50); }
        function getSharedWith(obj) { return Array.isArray(obj?.sharedWith) ? obj.sharedWith : (obj?.sharedWith ? [obj.sharedWith] : ['Alle']); }
        function getNextSaturday() { const d = new Date(); const diff = (6 - d.getDay() + 7) % 7; d.setDate(d.getDate() + diff); return d.toISOString().split('T')[0]; }
        function getWeekNumber(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil((((d - ys) / 86400000) + 1) / 7); }
        function getDaysLeft(dateStr) { const t = new Date(); t.setHours(0,0,0,0); const d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0); return Math.max(0, Math.round((d.getTime() - t.getTime()) / 86400000)); }
        function safeFormatDateTime(ts) { if (!ts) return ''; const d = new Date(ts); if (isNaN(d.getTime())) return ''; return `am ${d.toLocaleDateString('de-DE')} um ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} Uhr`; }
        function getEasterDate(year) { const f = Math.floor, G = year % 19, C = f(year / 100); const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30; const I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)); const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7; const L = I - J, month = 3 + f((L + 40) / 44), day = L + 28 - 31 * f(month / 4); return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }

        try {
            const p = new URLSearchParams(window.location.search);
            const c = p.get('cfg');
            if (c) {
                const d = JSON.parse(decodeURIComponent(escape(atob(c))));
                localStorage.setItem('familyConnectAppConfig', JSON.stringify(d));
                localStorage.setItem('firebaseConfig', JSON.stringify(d));
            }
        } catch (e) { }

        const origErr = console.error;
        console.error = function (...a) { origErr.apply(console, a); };
        window.addEventListener('error', () => { });
        window.addEventListener('unhandledrejection', (e) => { if (e.reason && e.reason.toString().includes('Database deleted')) e.preventDefault(); });

                    let uH = currHistory.map(h => h.id === event.id ? { ...h, acknowledgedBy: [...(Array.isArray(h.acknowledgedBy) ? h.acknowledgedBy : []), `${currentUser.name}:${isAccepted ? 'Bestätigt' : 'Abgelehnt'}`], proofImage: null } : h);
                    
                    const newId = Date.now().toString() + generateId();
                    if (!isAccepted) uH.unshift({ id: newId, timestamp: new Date().toISOString(), sender: currentUser.name, targets: [event.sender], acknowledgedBy: [], isCustomPush: true, category: 'other', reason: `Zahlung über ${event.amount?.toFixed(2) || '0.00'}€ abgelehnt.` });
                    else uH.unshift({ id: newId, timestamp: new Date().toISOString(), sender: currentUser.name, targets: [event.sender], acknowledgedBy: [], isCustomPush: true, category: 'other', reason: `Zahlung über ${event.amount?.toFixed(2) || '0.00'}€ bestätigt.` });
                    
                    await getFamilyDocRef(currentFamily.id).update({ expenses: nE, history: getCleanHistory(uH) }); 
                    setVerifyPaymentModal(null); 
                    setActiveTab('expenses');
                    if (isAccepted) showAlert("Erfolg", "Abrechnung erfolgreich!");
                } catch (e) { 
                    showAlert("Fehler", "Fehler bei der Überprüfung");
                } finally {
                    setIsSending(false);
                }
            };

            const setDND = async (h) => { let t = null; if (h > 0) { const d = new Date(); d.setMinutes(d.getMinutes() + Math.round(h * 60)); t = d.toISOString(); } await getFamilyDocRef(currentFamily.id).update({ members: safeMembers.map(m => m?.name === currentUser.name ? { ...m, dndUntil: t } : m) }); };
            const handleDeleteMember = (n) => { if (n === currentUser.name) return; showConfirm("Löschen", `${n} entfernen?`, async () => await getFamilyDocRef(currentFamily.id).update({ members: safeMembers.filter(m => m?.name !== n) }), true); };
            const saveSettings = async (k, v) => await getFamilyDocRef(currentFamily.id).update({ members: safeMembers.map(m => m?.name === currentUser.name ? { ...m, [k]: v ? String(v).trim() : '' } : m) });

            const saveGiftPerson = async (pId, updates) => {
                const uP = safeGiftPersons.map(p => p.id === pId ? { ...p, ...updates } : p);
                await getFamilyDocRef(currentFamily.id).update({ giftPersons: uP });
            };
            const addCustomGiftPerson = async () => {
                const n = prompt("Name der Person:");
                if (!n || !n.trim()) return;
                const uP = [...safeGiftPersons, { id: generateId(), name: n.trim(), type: 'custom', birthdate: '', nameday: '', birthdayNeedsGift: true, namedayNeedsGift: false, christmasNeedsGift: true, easterNeedsGift: true }];
                await getFamilyDocRef(currentFamily.id).update({ giftPersons: uP });
            };
            const handleGiftAction = async (eId, action, payload) => {
                const ev = safeGiftEvents.find(x => x.id === eId); if (!ev) return;
                const p = safeGiftPersons.find(x => x.id === ev.personId);
                let uE = [...safeGiftEvents];
                let hUpd = [];

                if (action === 'join_alone') {
                    uE = uE.map(e => e.id === eId ? { ...e, participants: [currentUser.name] } : e);
                } else if (action === 'invite') {
                    const sel = payload;
                    const cPart = ev.participants || [];
                    const nPart = cPart.includes(currentUser.name) ? cPart : [...cPart, currentUser.name];
                    const existingPend = ev.pendingParticipants || [];
                    const addedSel = sel.filter(s => !cPart.includes(s) && !existingPend.includes(s));
                    const removedSel = existingPend.filter(p => !sel.includes(p) && p !== currentUser.name);
                    
                    uE = uE.map(e => e.id === eId ? { ...e, participants: nPart, pendingParticipants: existingPend.filter(p => !removedSel.includes(p)).concat(addedSel) } : e);
                    
                    addedSel.forEach(t => hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: currentUser.name, reason: `${currentUser.name} lädt dich ein, ein Geschenk für ${p.name} zu planen.`, targets: [t], acknowledgedBy: [], isGiftInvite: true, eventId: eId, personName: p.name }));
                } else if (action === 'add_idea') {
                    uE = uE.map(e => e.id === eId ? { ...e, ideas: [...e.ideas, { id: generateId(), text: payload, addedBy: currentUser.name, votes: [] }] } : e);
                } else if (action === 'edit_idea') {
                    uE = uE.map(e => e.id === eId ? { ...e, ideas: e.ideas.map(i => i.id === payload.id ? { ...i, text: payload.text } : i) } : e);
                } else if (action === 'delete_idea') {
                    uE = uE.map(e => e.id === eId ? { ...e, ideas: e.ideas.filter(i => i.id !== payload) } : e);
                } else if (action === 'start_vote') {
                    uE = uE.map(e => e.id === eId ? { ...e, status: 'voting', voteDeadline: payload } : e);
                    hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: currentUser.name, reason: `Die Abstimmung für das Geschenk von ${p.name} läuft!`, targets: ev.participants.filter(x => x !== currentUser.name), acknowledgedBy: [], isCustomPush: true, category: 'other' });
                } else if (action === 'vote') {
                    uE = uE.map(e => e.id === eId ? { ...e, ideas: e.ideas.map(i => i.id === payload ? { ...i, votes: i.votes.includes(currentUser.name) ? i.votes.filter(x => x !== currentUser.name) : [...i.votes, currentUser.name] } : i) } : e);
                } else if (action === 'end_vote') {
                    let maxV = -1; let win = '';
                    ev.ideas.forEach(i => { if (i.votes.length > maxV) { maxV = i.votes.length; win = i.text; } });
                    uE = uE.map(e => e.id === eId ? { ...e, status: 'buying' } : e);
                    hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: 'System', reason: `Abstimmung beendet! Favorit für ${p.name}: ${win || 'Keine'}. Wer besorgt es?`, targets: ev.participants.filter(x => x !== currentUser.name), acknowledgedBy: [], isCustomPush: true, category: 'other' });
                } else if (action === 'claim_buy') {
                    uE = uE.map(e => e.id === eId ? { ...e, buyer: currentUser.name } : e);
                    hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: 'System', reason: `${currentUser.name} besorgt das Geschenk für ${p.name}!`, targets: ev.participants.filter(x => x !== currentUser.name), acknowledgedBy: [], isCustomPush: true, category: 'other' });
                } else if (action === 'settle') {
                    const amt = parseFloat(payload.amount.replace(',', '.'));
                    const extCount = parseInt(payload.extCount || '0', 10);
                    const totalP = ev.participants.length + extCount;
                    const perP = (amt / totalP).toFixed(2);
                    
                    let nE = [...safeExpenses];
                    ev.participants.forEach(mem => {
                        if (mem !== currentUser.name) {
                            nE.unshift({ id: generateId(), creditor: currentUser.name, debtor: mem, amount: perP, reason: `Geschenk für ${p.name}`, date: getLocalTodayString(), timestamp: new Date().toISOString(), isPaid: false });
                            hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: currentUser.name, reason: `Geschenk-Anteil für ${p.name}: ${perP}€`, targets: [mem], acknowledgedBy: [], isExpense: true });
                        }
                    });
                    uE = uE.map(e => e.id === eId ? { ...e, status: 'settled', cost: amt } : e);
                    await getFamilyDocRef(currentFamily.id).update({ giftEvents: uE, expenses: nE, history: [...hUpd, ...getCleanHistory(safeHistory)] });
                    setGiftsView('list'); setActiveGiftEventId(null);
                    return;
                }

                const updates = { giftEvents: uE };
                if (hUpd.length > 0) updates.history = [...hUpd, ...getCleanHistory(safeHistory)];
                await getFamilyDocRef(currentFamily.id).update(updates);
            };

            const renderGiftEventView = () => {
                const e = safeGiftEvents.find(x => x.id === activeGiftEventId);
                const p = safeGiftPersons.find(x => x.id === e?.personId);
                if (!e || !p) return null;
                const isPart = e.participants.includes(currentUser.name);
                const isNeedGift = e.type === 'birthdate' ? p.birthdayNeedsGift : e.type === 'nameday' ? p.namedayNeedsGift : e.type === 'christmas' ? p.christmasNeedsGift : p.easterNeedsGift;
                const isSolo = e.participants.length === 1 && e.participants[0] === currentUser.name && e.pendingParticipants.length === 0;
                
                const titleStr = e.type === 'birthdate' ? 'Geburtstag' : e.type === 'nameday' ? 'Namenstag' : e.type === 'christmas' ? 'Weihnachten' : 'Ostern';
                const iconName = e.type === 'birthdate' ? 'Cake' : e.type === 'nameday' ? 'Calendar' : e.type === 'christmas' ? 'Star' : 'Flower2';
                
                return (
                    <div className="absolute inset-0 bg-[var(--app-bg)] dark:bg-black z-50 flex flex-col animate-in slide-in-from-right duration-300">
                        <header className="pt-safe-top pb-4 px-4 bg-white/80 dark:bg-[#1C1C1E]/80 ios-blur flex items-center justify-between border-b border-[#E5E5EA] dark:border-[#38383A] z-10 shadow-sm">
                            <button onClick={() => { setActiveGiftEventId(null); activeHolidayView ? setGiftsView('holiday') : setGiftsView('list'); }} className="text-[#007AFF] p-1 flex items-center"><Icon name="ChevronRight" size={24} className="rotate-180" /></button>
                            <h2 className="font-bold text-[18px] truncate">{titleStr} von {p.name}</h2>
                            <div className="w-8"></div>
                        </header>
                        <main className="flex-1 overflow-y-auto p-4 space-y-6 pb-20">
                            <div className="text-center">
                                <Icon name={iconName} size={48} className="mx-auto mb-2 text-[#AF52DE]" />
                                <p className="text-[20px] font-bold">{formatDate(e.date)}</p>
                                <p className="text-[#8E8E93] text-[15px] font-medium">{getDaysLeft(e.date) === 0 ? 'Heute!' : `in ${getDaysLeft(e.date)} Tagen`}</p>
                            </div>

                            {!isNeedGift ? (
                                <div className="bg-[#007AFF]/10 p-5 rounded-[16px] text-center border border-[#007AFF]/20">
                                    <Icon name="Bell" size={24} className="text-[#007AFF] mx-auto mb-2" />
                                    <p className="text-[#007AFF] font-medium">Dies ist nur eine Erinnerung. Es ist kein Geschenk geplant.</p>
                                </div>
                            ) : (
                                <>
                                    {(!isPart && e.participants.length === 0) && (
                                        <div className={STYLES.card + " p-5 text-center"}>
                                            <h3 className="font-bold text-[18px] mb-4">Geschenk planen</h3>
                                            <div className="flex flex-col gap-3">
                                                <button onClick={() => handleGiftAction(e.id, 'join_alone')} className={STYLES.btnPrimary}>Allein schenken</button>
                                                <button onClick={() => setModal({
                                                    type: 'gift_participants', selected: [], activeMembersList, currentUser, personName: p.name,
                                                    setSelected: (n) => setModal(prev => ({ ...prev, selected: n })),
                                                    onSave: (sel) => { handleGiftAction(e.id, 'invite', sel); setModal(null); },
                                                    onClose: () => setModal(null)
                                                })} className={STYLES.btnSecondary + " !bg-[#AF52DE]/10 !text-[#AF52DE]"}>Zusammen schenken</button>
                                            </div>
                                        </div>
                                    )}
                                    {(!isPart && e.participants.length > 0) && (
                                        <div className={STYLES.card + " p-5 text-center"}>
                                            <p className="mb-4 text-[#8E8E93]">Geplant von: {e.participants.join(', ')}</p>
                                            {e.pendingParticipants.includes(currentUser.name) ? (
                                                <button onClick={() => {
                                                    const uE = safeGiftEvents.map(x => x.id === e.id ? { ...x, participants: [...x.participants, currentUser.name], pendingParticipants: x.pendingParticipants.filter(y => y !== currentUser.name) } : x);
                                                    getFamilyDocRef(currentFamily.id).update({ giftEvents: uE });
                                                }} className={STYLES.btnPrimary}>Einladung annehmen</button>
                                            ) : (
                                                <p className="font-semibold text-[#FF9500]">Du bist nicht beteiligt.</p>
                                            )}
                                        </div>
                                    )}
                                    {isPart && (
                                        <>
                                            <div className="bg-white dark:bg-[#1C1C1E] p-4 rounded-[16px] border border-[#E5E5EA] dark:border-[#38383A]">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h3 className="font-bold text-[16px] flex items-center gap-2"><Icon name="Users" size={16} /> Beteiligte</h3>
                                                    <button onClick={() => setModal({
                                                        type: 'gift_participants', selected: e.pendingParticipants.concat(e.participants.filter(x => x !== currentUser.name)), activeMembersList, currentUser, personName: p.name,
                                                        setSelected: (n) => setModal(prev => ({ ...prev, selected: n })),
                                                        onSave: (sel) => { handleGiftAction(e.id, 'invite', sel); setModal(null); },
                                                        onClose: () => setModal(null)
                                                    })} className="text-[#007AFF] text-[13px] font-bold">Verwalten</button>
                                                </div>
                                                <p className="text-[14px] text-[#3C3C43] dark:text-gray-300">{e.participants.join(', ')} {e.pendingParticipants.length > 0 && <span className="text-[#8E8E93]">(Warten auf: {e.pendingParticipants.join(', ')})</span>}</p>
                                            </div>

                                            {e.status === 'planning' && (
                                                <div className={STYLES.card + " p-5"}>
                                                    <h3 className="font-bold text-[18px] mb-4">Ideen Sammlung</h3>
                                                    <div className="space-y-3 mb-5">
                                                        {e.ideas.length === 0 ? <p className="text-[#8E8E93] text-[14px] italic">Noch keine Ideen.</p> : e.ideas.map(i => (
                                                            <div key={i.id} onClick={() => setModal({ type: 'gift_idea_edit', ideaText: i.text, setIdeaText: (t) => setModal(pr => ({...pr, ideaText: t})), onSave: (t) => { handleGiftAction(e.id, 'edit_idea', {id: i.id, text: t}); setModal(null); }, onDelete: () => { handleGiftAction(e.id, 'delete_idea', i.id); setModal(null); }, onClose: () => setModal(null) })} className="p-3 bg-[#F2F2F7] dark:bg-[#2C2C2E] rounded-[12px] cursor-pointer"><p className="font-semibold text-[15px] break-words"><Linkify text={i.text} /></p><p className="text-[11px] text-[#8E8E93] mt-1">von {i.addedBy}</p></div>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input type="text" placeholder="Neue Idee (auch Links)..." className={STYLES.input} value={newGiftIdea} onChange={ev => setNewGiftIdea(ev.target.value)} />
                                                        <button onClick={() => { if (newGiftIdea.trim()) { handleGiftAction(e.id, 'add_idea', newGiftIdea.trim()); setNewGiftIdea(''); } }} className="bg-[#AF52DE] text-white px-4 rounded-[12px] shrink-0"><Icon name="Plus" size={20} /></button>
                                                    </div>
                                                    {e.ideas.length > 0 && !isSolo && (
                                                        <button onClick={() => handleGiftAction(e.id, 'start_vote', null)} className="w-full mt-5 py-3 rounded-[12px] font-bold text-[15px] bg-[#007AFF]/10 text-[#007AFF]">Abstimmung starten</button>
                                                    )}
                                                    {e.ideas.length > 0 && isSolo && (
                                                        <button onClick={() => handleGiftAction(e.id, 'claim_buy')} className="w-full mt-5 py-3 rounded-[12px] font-bold text-[15px] bg-[#AF52DE]/10 text-[#AF52DE]">Als besorgt markieren</button>
                                                    )}
                                                </div>
                                            )}

                                            {e.status === 'voting' && !isSolo && (
                                                <div className={STYLES.card + " p-5 border-[#007AFF] border-2"}>
                                                    <h3 className="font-bold text-[18px] mb-4 text-[#007AFF]">Abstimmung läuft</h3>
                                                    <div className="space-y-3 mb-5">
                                                        {e.ideas.map(i => {
                                                            const mV = i.votes.includes(currentUser.name);
                                                            return (
                                                                <div key={i.id} onClick={() => handleGiftAction(e.id, 'vote', i.id)} className={`flex justify-between items-center p-3 rounded-[12px] border cursor-pointer ${mV ? 'bg-[#007AFF]/10 border-[#007AFF]' : 'bg-[var(--app-bg)] dark:bg-[#2C2C2E] border-transparent'}`}>
                                                                    <div className="min-w-0 pr-2"><p className="font-semibold truncate"><Linkify text={i.text} /></p><p className="text-[12px] text-[#8E8E93]">{i.votes.length} Stimme(n)</p></div>
                                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${mV ? 'border-[#007AFF] bg-[#007AFF]' : 'border-[#C6C6C8]'}`}>{mV && <Icon name="Check" size={14} className="text-white" />}</div>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                    <button onClick={() => handleGiftAction(e.id, 'end_vote')} className="w-full py-3 rounded-[12px] font-bold text-[15px] bg-[#007AFF] text-white shadow-sm">Abstimmung beenden</button>
                                                </div>
                                            )}

                                            {(e.status === 'buying' || e.status === 'settled') && (
                                                <div className={STYLES.card + " p-5"}>
                                                    <h3 className="font-bold text-[18px] mb-4">Besorgung</h3>
                                                    {e.ideas.length > 0 && (
                                                        <div className="mb-4 p-3 bg-[#34C759]/10 rounded-[12px] border border-[#34C759]/30">
                                                            <p className="text-[12px] text-[#34C759] font-bold uppercase mb-1">{isSolo ? 'Ideen' : 'Favoriten'}</p>
                                                            {(() => {
                                                                if (isSolo) return e.ideas.map(f => <p key={f.id} className="font-semibold break-words"><Linkify text={f.text} /></p>);
                                                                let mx = -1; e.ideas.forEach(i => { if(i.votes.length > mx) mx = i.votes.length; });
                                                                const favs = e.ideas.filter(i => i.votes.length === mx);
                                                                return favs.map(f => <p key={f.id} className="font-semibold break-words"><Linkify text={f.text} /></p>);
                                                            })()}
                                                        </div>
                                                    )}
                                                    {!e.buyer ? (
                                                        <button onClick={() => handleGiftAction(e.id, 'claim_buy')} className="w-full py-4 rounded-[14px] bg-[#AF52DE] text-white font-bold text-[17px] shadow-sm">Ich besorge es!</button>
                                                    ) : (
                                                        <div className="text-center">
                                                            <Icon name="ShoppingCart" size={32} className="mx-auto text-[#007AFF] mb-2" />
                                                            <p className="font-medium text-[16px] mb-4"><span className="font-bold">{e.buyer}</span> besorgt das Geschenk.</p>
                                                            
                                                            {e.buyer === currentUser.name && !e.settled && e.status !== 'settled' && (
                                                                <div className="bg-[#F2F2F7] dark:bg-[#2C2C2E] p-4 rounded-[16px] text-left">
                                                                    <p className="font-bold mb-3">Kosten eintragen</p>
                                                                    <div className="space-y-3">
                                                                        <input type="text" inputMode="decimal" placeholder="Gesamtpreis in €" className={STYLES.input} value={giftBuyerAmount} onChange={ev => setGiftBuyerAmount(ev.target.value.replace(/[^0-9.,]/g, ''))} />
                                                                        {!isSolo && (
                                                                            <div>
                                                                                <p className={STYLES.subTitle + " !ml-1"}>Zahlen externe Personen mit? (Anzahl)</p>
                                                                                <input type="number" min="0" className={STYLES.input} value={giftBuyerExtCount} onChange={ev => setGiftBuyerExtCount(ev.target.value)} />
                                                                            </div>
                                                                        )}
                                                                        <button onClick={() => { if(giftBuyerAmount) handleGiftAction(e.id, 'settle', { amount: giftBuyerAmount, extCount: giftBuyerExtCount }) }} className={STYLES.btnPrimary}>{isSolo ? 'Als erledigt markieren' : 'Kosten aufteilen & buchen'}</button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                            {e.status === 'settled' && (
                                                                <p className="text-[#34C759] font-bold mt-2 flex justify-center items-center gap-1"><Icon name="CheckCircle2" size={18} /> Erledigt & Verrechnet ({e.cost}€)</p>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </>
                                    )}
                                </>
                            )}
                        </main>
                    </div>
                );
            };

            if (!appLoaded) return <div className="h-full w-full bg-[var(--app-bg)] flex flex-col items-center justify-center relative z-50"><Icon name="ShieldCheck" size={64} strokeWidth={1.5} className="text-[#007AFF] animate-pulse mb-4" /></div>;

            if (isAdminMode) {
                return (
                    <div className="h-full w-full bg-[var(--app-bg)] font-sans flex flex-col relative z-40 overflow-hidden">
                        <Modal data={modal} onClose={() => setModal(null)} />
                        <div className="flex-1 flex flex-col w-full max-w-5xl mx-auto relative h-full">
                            <header className="flex-none pt-safe-top pb-4 px-6 bg-white/80 dark:bg-[#1C1C1E]/80 ios-blur border-b border-[#E5E5EA] dark:border-[#38383A] z-40 flex justify-between items-end sticky top-0">
                                <h1 className="text-[28px] font-extrabold text-black dark:text-white tracking-tight leading-none mt-6">Admin-Dashboard</h1>
                                {currentUser ? (
                                    <button onClick={() => setIsAdminMode(false)} className="text-[#007AFF] font-bold active:opacity-70 bg-[#007AFF]/10 px-4 py-2 rounded-full text-[14px] flex items-center gap-1.5"><Icon name="LogOut" size={14} className="rotate-180" /> Zurück zum Account</button>
                                ) : (<button onClick={() => setIsAdminMode(false)} className="text-[#FF3B30] font-semibold active:opacity-70">Logout</button>)}
                            </header>
                            <main className="scrollable-area px-6 py-6 w-full">
                                <div className="max-w-4xl mx-auto space-y-8 pb-20">
                                    <section className={STYLES.card + " p-6"}><h2 className="text-[18px] font-bold mb-4 text-black dark:text-white">Neue Familie anlegen</h2><div className="flex flex-col sm:flex-row gap-3"><input type="text" placeholder="Name der Familie" className={STYLES.input + " sm:flex-1"} value={newFamilyName} onChange={e => setNewFamilyName(e.target.value)} /><button onClick={adminCreateFamily} className={STYLES.btnPrimary + " sm:w-auto px-6 !mt-0"}>Erstellen</button></div></section>
                                    <div className="space-y-6">
                                        {adminFamilies.map(fam => {
                                            const lSM = Array.isArray(fam.members) ? fam.members.filter(m => m && m.name) : []; const pD = adminPushData[fam.id] || { title: '', message: '' };
                                            return (
                                                <div key={fam.id} className={STYLES.card}>
                                                    <div className="p-5 bg-[#F9F9F9] dark:bg-[#2C2C2E] border-b border-[#E5E5EA] dark:border-[#38383A] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0"><div><h3 className="font-bold text-[20px] text-black dark:text-white">{fam.name}</h3><p className="text-[#8E8E93] dark:text-[#EBEBF5]/60 text-[13px] font-mono mt-1">ID: {fam.id}</p></div><div className="flex w-full sm:w-auto gap-2"><button onClick={() => generatePDF(fam)} className="flex-1 sm:flex-none justify-center bg-[#007AFF]/10 text-[#007AFF] px-4 py-2.5 rounded-full text-[13px] font-semibold flex items-center gap-1.5"><Icon name="FileText" size={14} /> PDF Info-Blatt</button><button onClick={() => adminDeleteFamily(fam.id)} className="bg-[#FF3B30]/10 text-[#FF3B30] w-10 h-10 sm:w-9 sm:h-9 rounded-full flex items-center justify-center shrink-0"><Icon name="Trash2" size={16} /></button></div></div>

 ...formInput, name: e.target.value })} /><input type="password" placeholder="Passwort" className="w-full bg-white/10 px-4 py-3.5 rounded-xl text-white box-border" value={formInput.password} onChange={e => setFormInput({ ...formInput, password: e.target.value })} />{authError && <p className="text-[#FF3B30] text-[13px] text-center">{authError}</p>}<button onClick={() => authMode === 'login' ? handleLogin() : handleJoinFamily()} className="w-full bg-[#007AFF] text-white font-semibold py-3.5 rounded-xl mt-4">{authMode === 'login' ? 'Anmelden' : 'Beitreten'}</button></>)}</div></div></div>

                                        )
                                    }
                                });

                            )}

                            {activeTab === 'household' && (
                                <div className="space-y-8 pb-10 animate-in fade-in">
                                    {!householdAdminMode ? (
                                        <>
                                            <section>
                                                <div className="flex justify-between items-end mb-4"><h2 className={STYLES.subTitle + " !mb-0"}>Diese Woche (bis {formatDate(upcomingSatDate)})</h2>{canEditHousehold && <button onClick={() => setHouseholdAdminMode(true)} className="text-[#007AFF] text-[13px] font-bold bg-[#007AFF]/10 px-3 py-1.5 rounded-full"><Icon name="Settings" size={14} className="inline mr-1" /> Plan bearbeiten</button>}</div>
                                                <div className="space-y-4">
                                                    {safeHouseholdMembers.map(member => {
                                                        const memberTasks = householdTasks.filter(t => t.date === upcomingSatDate && t.assignedTo === member);
                                                        if (memberTasks.length === 0) return null;
                                                        const isMe = member === currentUser.name;
                                                        return (
                                                            <div key={member} className={STYLES.card + ` border-l-4 ${isMe ? 'border-l-[#007AFF]' : 'border-l-transparent'}`}>
                                                                <div className="p-3 bg-[#F9F9F9] dark:bg-[#2C2C2E] border-b border-[#E5E5EA] dark:border-[#38383A] flex justify-between items-center">
                                                                    <h3 className={`font-bold text-[16px] ${isMe ? 'text-[#007AFF]' : ''}`}>{isMe ? 'Deine Aufgaben' : member}</h3>
                                                                </div>
                                                                <div className="divide-y divide-[#E5E5EA] dark:divide-[#38383A]">
                                                                    {memberTasks.map(task => (
                                                                        <div key={task.id} className="p-3.5 flex justify-between items-center gap-3">
                                                                            <div className="min-w-0 flex-1">
                                                                                <p className={`font-semibold text-[15px] truncate ${task.status === 'completed' ? 'text-[#8E8E93] line-through' : ''}`}>{task.choreName}</p>
                                                                                {task.swapRequestedWith && task.status !== 'completed' && <p className="text-[#FF9500] text-[12px] font-medium mt-0.5">Wartet auf Vertretung ({task.swapRequestedWith})</p>}
                                                                            </div>
                                                                            <div className="flex gap-2 shrink-0">
                                                                                {task.status === 'completed' ? (
                                                                                    <div className="w-8 h-8 rounded-full bg-[#34C759]/20 flex items-center justify-center text-[#34C759]"><Icon name="Check" size={18} strokeWidth={3} /></div>
                                                                                ) : isMe ? (
                                                                                    <>
                                                                                        <button onClick={() => setHouseholdSwapModal(task.id)} className="w-8 h-8 rounded-full bg-[#FF9500]/10 flex items-center justify-center text-[#FF9500]"><Icon name="Users" size={16} /></button>
                                                                                        <button onClick={() => handleHouseholdAction(task.id, 'complete')} className="w-8 h-8 rounded-full bg-[#007AFF]/10 flex items-center justify-center text-[#007AFF]"><Icon name="Check" size={16} /></button>
                                                                                    </>
                                                                                ) : (
                                                                                    <button onClick={() => handleHouseholdAction(task.id, 'takeover')} className="text-[12px] font-bold text-[#007AFF] bg-[#007AFF]/10 px-2 py-1.5 rounded-lg active:opacity-70">Übernehmen</button>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </section>

                                            <section>
                                                <h2 className={STYLES.subTitle}>Aufgaben-Historie</h2>
                                                <div className={STYLES.card + " divide-y divide-[#E5E5EA] dark:divide-[#38383A]"}>
                                                    {safeHouseholdChores.map(chore => (
                                                        <div key={chore.id} onClick={() => setHouseholdHistoryModal(chore.id)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-[#2C2C2E]/50 transition-colors">
                                                            <span className="font-medium text-[15px]">{chore.name}</span>
                                                            <Icon name="ChevronRight" size={18} className="text-[#8E8E93]" />
                                                        </div>
                                                    ))}
                                                </div>
                                            </section>
                                        </>
                                    ) : (
                                        <section>
                                            <div className="flex justify-between items-center mb-4"><h2 className="text-[20px] font-bold text-[#FF9500] flex items-center gap-2"><Icon name="Settings" size={20} /> Haushalts-Planer</h2><button onClick={() => setHouseholdAdminMode(false)} className="text-[14px] font-bold bg-[#F2F2F7] dark:bg-[#2C2C2E] px-4 py-2 rounded-full">Zurück</button></div>
                                            
                                            <div className="space-y-6">
                                                <div className={STYLES.card + " p-4"}>
                                                    <h3 className={STYLES.subTitle + " !ml-0 mb-3"}>Rotierende Mitglieder</h3>
                                                    <div className="flex flex-wrap gap-2 mb-4">
                                                        {activeMembersList.map(m => {
                                                            const isAct = safeHouseholdMembers.includes(m.name);
                                                            return (
                                                                <button key={m.name} onClick={() => toggleHouseholdMember(m.name)} className={`px-3 py-1.5 rounded-full text-[13px] font-bold transition-colors ${isAct ? 'bg-[#007AFF] text-white' : 'bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[#8E8E93]'}`}>{m.name}</button>
                                                            )
                                                        })}
                                                    </div>
                                                    <p className="text-[12px] text-[#8E8E93]">Gewählte Mitglieder rotieren wöchentlich durch die Aufgabenliste.</p>
                                                </div>

                                                <div className={STYLES.card + " p-4"}>
                                                    <h3 className={STYLES.subTitle + " !ml-0 mb-3"}>Aufgaben (Chores)</h3>
                                                    <div className="space-y-2 mb-4">
                                                        {safeHouseholdChores.map(c => (
                                                            <div key={c.id} className="flex justify-between items-center bg-[#F2F2F7] dark:bg-[#2C2C2E] p-3 rounded-[12px]">
                                                                <span className="font-medium text-[14px]">{c.name}</span>
                                                                <button onClick={() => handleDeleteChore(c.id)} className="text-[#FF3B30] p-1"><Icon name="Trash2" size={16} /></button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input type="text" placeholder="Neue Aufgabe..." className={STYLES.input + " !py-2"} value={newChoreName} onChange={e => setNewChoreName(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleAddChore()} />
                                                        <button onClick={handleAddChore} disabled={!newChoreName.trim()} className="bg-[#007AFF] text-white px-4 rounded-[12px]"><Icon name="Plus" size={20} /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </section>
                                    )}
                                </div>
                            )}

                            {activeTab === 'expenses' && (
                                <div className="space-y-8 pb-10 animate-in fade-in">
                                    <div className="flex gap-3 px-1">
                                        <button onClick={() => openSingleExpense(null)} className="flex-1 bg-gradient-to-tr from-[#34C759] to-[#32B353] text-white p-4 rounded-[20px] shadow-sm flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform"><Icon name="Plus" size={24} /><span className="font-bold text-[14px]">Neue Auslage</span></button>
                                        <button onClick={openSplitExpense} className="flex-1 bg-gradient-to-tr from-[#007AFF] to-[#5856D6] text-white p-4 rounded-[20px] shadow-sm flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform"><Icon name="PieChart" size={24} /><span className="font-bold text-[14px]">Kosten teilen</span></button>
                                    </div>

                                    <section>
                                        <h2 className={STYLES.subTitle}>Ausstehende Abrechnungen</h2>
                                        <div className="space-y-5">
                                            {activeMembersList.filter(m => m.name !== currentUser.name).sort((a,b) => {
                                                const eWTA = safeExpenses.filter(e => !e.isPaid && !e.paymentPending && ((e.creditor === currentUser?.name && e.debtor === a.name) || (e.creditor === a.name && e.debtor === currentUser?.name)));
                                                const eWTB = safeExpenses.filter(e => !e.isPaid && !e.paymentPending && ((e.creditor === currentUser?.name && e.debtor === b.name) || (e.creditor === b.name && e.debtor === currentUser?.name)));
                                                const hP_A = safeExpenses.some(e => !e.isPaid && e.paymentPending && ((e.creditor === currentUser?.name && e.debtor === a.name) || (e.creditor === a.name && e.debtor === currentUser?.name)));
                                                const hP_B = safeExpenses.some(e => !e.isPaid && e.paymentPending && ((e.creditor === currentUser?.name && e.debtor === b.name) || (e.creditor === b.name && e.debtor === currentUser?.name)));

                                                let netA = 0; eWTA.forEach(e => { if (e.creditor === currentUser?.name) netA += parseFloat(e.amount)||0; else netA -= parseFloat(e.amount)||0; });
                                                let netB = 0; eWTB.forEach(e => { if (e.creditor === currentUser?.name) netB += parseFloat(e.amount)||0; else netB -= parseFloat(e.amount)||0; });

                                                const getCat = (net, count, hp) => { if (net < 0) return 0; if (net > 0) return 1; if (hp && count === 0) return 2; return 3; };
                                                const catA = getCat(netA, eWTA.length, hP_A);
                                                const catB = getCat(netB, eWTB.length, hP_B);

                                                if (catA !== catB) return catA - catB;
                                                if (catA === 0) return netA - netB;
                                                if (catA === 1) return netB - netA;
                                                return a.name.localeCompare(b.name);
                                            }).map(m => {
                                                const eWT = safeExpenses.filter(e => !e.isPaid && !e.paymentPending && ((e.creditor === currentUser?.name && e.debtor === m.name) || (e.creditor === m.name && e.debtor === currentUser?.name)));
                                                let iO = 0; let tO = 0; eWT.forEach(e => { const a = parseFloat(e.amount) || 0; if (e.creditor === currentUser?.name) tO += a; else iO += a; }); const net = tO - iO;
                                                const hasPending = safeExpenses.some(e => !e.isPaid && e.paymentPending && ((e.creditor === currentUser?.name && e.debtor === m.name) || (e.creditor === m.name && e.debtor === currentUser?.name)));
                                                
                                                const isExpanded = expandedExpenses[m.name];
                                                const displayExpenses = isExpanded ? eWT : eWT.slice(0, 3);
                                                const hasMore = eWT.length > 3;

                                                return (
                                                    <div key={m.name} className={STYLES.card + " flex flex-col h-full"}><div className="p-4 flex justify-between items-center bg-[#F9F9F9] dark:bg-[#2C2C2E]"><div className="min-w-0 pr-2 cursor-pointer active:opacity-70" onClick={() => setExpenseHistoryModal(m.name)}><p className="font-bold text-[18px] truncate">{m.name}</p>
                                                        <p className={`text-[14px] font-semibold mt-0.5 truncate ${net > 0 ? 'text-[#34C759]' : net < 0 ? 'text-[#FF3B30]' : (hasPending && eWT.length === 0) ? 'text-[#FF9500]' : 'text-[#8E8E93]'}`}>{net > 0 ? `Schuldet dir: ${net.toFixed(2)}€` : net < 0 ? `Noch fällig: ${Math.abs(net).toFixed(2)}€` : (hasPending && eWT.length === 0) ? 'Wird geprüft.' : 'Alles beglichen'}</p>
                                                    </div><div className="flex gap-2">{eWT.length > 0 && <button onClick={() => net >= 0 ? handleSettleAll(m.name, eWT, Math.abs(net)) : openDebtorProofModal(m.name, Math.abs(net), eWT)} className="w-9 h-9 bg-[#34C759]/10 text-[#34C759] rounded-full flex justify-center items-center active:opacity-70 flex-shrink-0"><Icon name="CheckCircle2" size={20} /></button>}<button onClick={() => openSingleExpense(m.name)} className="w-9 h-9 bg-[#007AFF]/10 text-[#007AFF] rounded-full flex justify-center items-center active:opacity-70 flex-shrink-0"><Icon name="Plus" size={20} /></button></div></div>{eWT.length > 0 && (<div className="border-t border-[#E5E5EA] dark:border-[#38383A] p-4 space-y-3 flex-1 overflow-y-auto">{displayExpenses.map(e => { const iMC = e.creditor === currentUser?.name; return (<div key={e.id} className={`flex justify-between items-center bg-white dark:bg-[#1C1C1E] border p-3 rounded-[16px] ${iMC ? 'border-[#007AFF]/30' : 'border-[#E5E5EA] dark:border-[#38383A]'}`}><div className="pr-3 min-w-0 flex-1"><p className="text-[15px] font-semibold truncate">{e.reason}</p><p className="text-[12px] text-[#8E8E93] font-medium">{formatDate(e.date || e.timestamp)}</p></div><div className="flex flex-col items-end gap-2 flex-shrink-0"><span className={`font-semibold text-[16px] ${iMC ? 'text-[#34C759]' : 'text-[#FF3B30]'}`}>{iMC ? '+' : '-'}{parseFloat(e.amount || 0).toFixed(2)}€</span>{iMC ? (<div className="flex gap-1.5 mt-1"><button onClick={() => openEditExpense(e)} className="w-8 h-8 bg-[#007AFF]/10 text-[#007AFF] rounded-full flex justify-center items-center"><Icon name="Pencil" size={14} /></button><button onClick={() => handleMarkExpensePaid(e.id)} className="w-8 h-8 bg-[#34C759]/10 text-[#34C759] rounded-full flex justify-center items-center"><Icon name="Check" size={16} /></button><button onClick={() => handleDeleteExpense(e.id)} className="w-8 h-8 bg-[#FF3B30]/10 text-[#FF3B30] rounded-full flex justify-center items-center"><Icon name="Trash2" size={14} /></button></div>) : (<span className="text-[11px] uppercase font-bold text-[#8E8E93] bg-[var(--app-bg)] dark:bg-[#2C2C2E] px-2.5 py-1 rounded-full mt-1">Offen</span>)}</div></div>) })}
                                                        {hasMore && <button onClick={() => setExpandedExpenses(p => ({ ...p, [m.name]: !isExpanded }))} className="w-full py-2.5 text-[13px] font-bold text-[#8E8E93] bg-[#F2F2F7] dark:bg-[#2C2C2E] rounded-[10px] active:opacity-70 flex justify-center items-center gap-1 mt-2"><Icon name={isExpanded ? "ChevronUp" : "ChevronDown"} size={14} /> {isExpanded ? "Weniger anzeigen" : `Alle ${eWT.length} Auslagen anzeigen`}</button>}
                                                        </div>)}</div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                </div>
                            )}
                        </main>
                    </div>
                    <LiquidTabBar activeTab={activeTab} setActiveTab={setActiveTab} activeModIds={activeModIds} isKeyboardOpen={isKeyboardOpen} />
                    
                    {expenseModal && (
                        <div className={STYLES.modalOverlay}><div className={STYLES.modalContent + " !h-auto"}><button onClick={() => setExpenseModal(null)} className="absolute top-4 right-4 text-[#8E8E93] active:opacity-70"><Icon name="X" size={24} /></button><h3 className="font-bold text-[20px] mb-6 pr-6">{expenseModal.mode === 'edit' ? 'Auslage bearbeiten' : expenseModal.mode === 'split' ? 'Kosten aufteilen' : `Auslage für ${expenseModal.target}`}</h3><div className="space-y-4">
                            <div><label className="text-[12px] font-medium text-[#8E8E93] ml-1 mb-1 block">Betrag (€)</label><input type="text" inputMode="decimal" placeholder="0,00" value={expenseForm.amount} onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value.replace(/[^0-9.,]/g, '') })} className={STYLES.input + " text-[24px] font-bold py-4"} /></div>
                            <div><label className="text-[12px] font-medium text-[#8E8E93] ml-1 mb-1 block">Wofür?</label><input type="text" placeholder="z.B. Einkauf Rewe" value={expenseForm.reason} onChange={e => setExpenseForm({ ...expenseForm, reason: e.target.value })} className={STYLES.input} /></div>
                            <div><label className="text-[12px] font-medium text-[#8E8E93] ml-1 mb-1 block">Datum</label><input type="date" value={expenseForm.date} onChange={e => setExpenseForm({ ...expenseForm, date: e.target.value })} className={STYLES.input} /></div>
                            {expenseModal.mode === 'split' && (
                                <>
                                    <div><label className="text-[12px] font-medium text-[#8E8E93] ml-1 mb-1 block">Durch wie viele teilen? (Inkl. dir)</label><div className="flex items-center gap-3"><button onClick={() => setExpenseForm(p => ({ ...p, splitCount: Math.max(1, p.splitCount - 1) }))} className="w-12 h-12 bg-[#F2F2F7] dark:bg-[#2C2C2E] rounded-full flex items-center justify-center text-[20px] font-bold">-</button><span className="text-[20px] font-bold w-8 text-center">{expenseForm.splitCount}</span><button onClick={() => setExpenseForm(p => ({ ...p, splitCount: p.splitCount + 1 }))} className="w-12 h-12 bg-[#F2F2F7] dark:bg-[#2C2C2E] rounded-full flex items-center justify-center text-[20px] font-bold">+</button></div></div>
                                    <div><label className="text-[12px] font-medium text-[#8E8E93] ml-1 mb-2 block">Wer schuldet dir Geld?</label><div className="flex flex-wrap gap-2">{activeMembersList.filter(m => m.name !== currentUser.name).map(m => { const isSel = expenseForm.splitTargets.includes(m.name); return (<button key={m.name} onClick={() => toggleSplitTarget(m.name)} className={`px-4 py-2 rounded-full text-[14px] font-bold transition-colors ${isSel ? 'bg-[#007AFF] text-white' : 'bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[#8E8E93]'}`}>{m.name}</button>) })}</div></div>
                                </>
                            )}
                            <div className="pt-2 flex flex-col gap-3">
                                <button onClick={handleSaveExpense} className={STYLES.btnPrimary}>{expenseModal.mode === 'edit' ? 'Speichern' : 'Hinzufügen'}</button>
                                {expenseModal.mode === 'edit' && <button onClick={() => showConfirm("Löschen", "Diese Auslage wirklich löschen?", async () => { await handleDeleteExpense(expenseModal.expense.id); setExpenseModal(null); }, true)} className={STYLES.btnDanger + " !mt-0"}>Eintrag löschen</button>}
                            </div>
                        </div></div></div>
                    )}
                </div>
            );
        }

        function Root() {
            const p = new URLSearchParams(window.location.search);
            const act = p.get('action'); const iS = act === 'shortcut' || act === 'add_shopping';
            const [cfg, setCfg] = useState(() => {
                try {
                    const uC = p.get('cfg'); if (uC) { const d = JSON.parse(decodeURIComponent(escape(atob(uC)))); localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(d)); return d; }
                    if (typeof __firebase_config !== 'undefined' && __firebase_config) return typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    const s = localStorage.getItem(CONFIG_STORAGE_KEY) || localStorage.getItem('firebaseConfig'); if (s) return JSON.parse(s);
                } catch (e) { } return null;
            });
            const [s, setS] = useState("booting"); const [eM, setEM] = useState("");

            useEffect(() => {
                if (!cfg) return setS("config-needed"); setS("booting");
                try {
                    const fC = cfg.firebaseConfig ? cfg.firebaseConfig : cfg;
                    if (!firebase.apps.length) app = firebase.initializeApp(fC); else app = firebase.app();
                    db = firebase.firestore(); 
                    try { 
                        db.enablePersistence({ synchronizeTabs: true }).catch(e => { console.warn("Persistence error", e); });
                    } catch (e) { }
                    auth = firebase.auth();
                    messaging = firebase.messaging();
                    setS("ready");
                } catch (e) { setEM("Verbindungsfehler: " + e.message); setS("error"); }
            }, [cfg]);

            if (s === "config-needed") return <ConfigLoader onConfigLoaded={setCfg} />;
            if (s === "error") return (<div className="h-full w-full bg-[var(--app-bg)] dark:bg-black text-black dark:text-white flex flex-col items-center justify-center p-8 text-center relative z-50"><Icon name="ShieldCheck" size={64} className="text-[#FF3B30] mb-4" /><h2 className="text-xl font-bold mb-2">Systemfehler</h2><p className="text-[#FF3B30] text-[15px] mb-8 font-mono bg-[#FF3B30]/10 p-4 rounded-[16px] border border-[#FF3B30]/20">{eM}</p><button onClick={() => { localStorage.removeItem(CONFIG_STORAGE_KEY); localStorage.removeItem('firebaseConfig'); setCfg(null); setS("config-needed"); }} className="w-full bg-[#007AFF] text-white py-3.5 rounded-[16px] font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm">Neue Config laden</button></div>);
            if (s === "booting") return <div className="h-full w-full bg-[var(--app-bg)] dark:bg-black flex flex-col items-center justify-center relative z-50"><Icon name="ShieldCheck" size={64} className="text-[#007AFF] animate-pulse mb-4" /></div>;
            return <App />;
        }

        if (!window.isFastMode) {
            const root = createRoot(document.getElementById('root'));
            root.render(<Root />);
        }
    </script>
</body>
</html>
