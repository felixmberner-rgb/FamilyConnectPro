<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FamilyConnect">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>FamilyConnect</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'media' }</script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fastAction = urlParams.get('action');
        if (fastAction === 'shortcut' || fastAction === 'add_shopping') {
            window.isFastMode = true;
            document.addEventListener("DOMContentLoaded", async () => {
                document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#fff;font-family:sans-serif;font-size:20px;font-weight:bold;">Verarbeite...</div>';
                try {
                    const cfgStr = urlParams.get('cfg');
                    if (!cfgStr) throw new Error("No config");
                    const config = JSON.parse(decodeURIComponent(escape(atob(cfgStr))));
                    const finalConfig = config.firebaseConfig ? config.firebaseConfig : config;

                    firebase.initializeApp(finalConfig);
                    const db = firebase.firestore();
                    await firebase.auth().signInAnonymously();

                    const fid = urlParams.get('fid');
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-connect-pro';
                    const docRef = db.doc(`artifacts/${appId}/public/data/families/${fid}`);
                    const docSnap = await docRef.get();

                    if (!docSnap.exists) throw new Error("Family not found");
                    const data = docSnap.data();

                    if (fastAction === 'shortcut') {
                        const reasonId = urlParams.get('reason');
                        const REASONS = {
                            'general_meal': { sentence: 'Das Essen ist fertig!', category: 'meal' },
                            'breakfast': { sentence: 'Das Frühstück ist fertig!', category: 'meal' },
                            'lunch': { sentence: 'Das Mittagessen ist fertig!', category: 'meal' },
                            'coffee': { sentence: 'Es gibt Kaffee und Kuchen!', category: 'meal' },
                            'dinner': { sentence: 'Das Abendessen ist fertig!', category: 'meal' },
                            'table': { sentence: 'Hilfe beim Tischdecken wird benötigt!', category: 'push_only' },
                            'message': { sentence: 'Bitte komme ins Wohnzimmer!', category: 'other' },
                            'movie': { sentence: 'Der Film fängt gleich an!', category: 'other' },
                            'game': { sentence: 'Wir wollen spielen, komm dazu!', category: 'other' }
                        };
                        const rObj = REASONS[reasonId] || { sentence: 'Ruf über Kurzbefehl!', category: 'other' };

                        const now = new Date();
                        const isNightMode = now.getHours() >= 22 || now.getHours() < 7;
                        const actualTargets = [];
                        const fetchPromises = [];

                        (data.members || []).forEach(m => {
                            if (m && m.status !== 'pending') {
                                const isDND = m.dndUntil && new Date(m.dndUntil) > now;
                                if (!isDND) {
                                    actualTargets.push(m.name);
                                    if (!isNightMode && rObj.category !== 'push_only') {
                                        const u = rObj.category === 'meal' ? m.voiceMonkeyMeal : m.voiceMonkeyOther;
                                        if (u && u.trim()) fetchPromises.push(fetch(u).catch(() => { }));
                                    }
                                }
                            }
                        });

                        if (actualTargets.length > 0) {
                            const isExpired = (ts) => { if (!ts) return true; const t = new Date(ts).getTime(); return isNaN(t) ? true : (Date.now() - t) > 5 * 60 * 1000; };
                            const cleanHistory = (data.history || []).filter(h => h.isExpense || h.isHousehold || h.isSystemReminder || h.isCustomPush || h.isSwapRequest || h.isSuccessfulSwap || h.isRejectedSwap || h.isPaymentVerification || h.isSettlement || !isExpired(h.timestamp)).slice(0, 50);
                            const newHistoryItem = { id: Date.now().toString(), timestamp: now.toISOString(), sender: 'Extern', reason: rObj.sentence, targets: actualTargets, acknowledgedBy: [], isExpense: false, isResend: false, category: rObj.category, isCustomPush: true };

                            await docRef.update({ history: [newHistoryItem, ...cleanHistory] });
                            await Promise.all(fetchPromises);

                            document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#34C759;font-family:sans-serif;font-size:22px;font-weight:bold;">Erfolgreich gesendet! ✅</div>';
                        } else {
                            document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#FF9500;font-family:sans-serif;font-size:22px;font-weight:bold;">Alle im Nicht-Stören Modus 🔕</div>';
                        }
                    }
                    else if (fastAction === 'add_shopping') {
                        const itemsParam = urlParams.get('items');
                        if (!itemsParam) throw new Error("No items");
                        const listNameParam = urlParams.get('listName');
                        const userParam = urlParams.get('user');

                        const getCat = (l) => {
                            if (/scheuer|spül|wasch|seife|klo|papier|tuch|shampoo|deo|zahnpasta|müll|putz|creme|dusch|rasier|bürste|schwamm|reiniger|watte|windel|slipeinlage|tampon|binde|rolle|wc|lotion|pflegetücher|waschmittel|klobürste|zahnseide|hygiene/i.test(l)) return 'Haushalt & Drogerie';
                            if (/apfel|äpfel|banan|tomate|gurke|obst|gemüse|salat|zwiebel|kartoffel|knoblauch|beere|traube|paprika|möhre|karotte|pilz|zitrone|orange|birne|birnen|pflaume|melone|kiwi|kürbis|lauch|sellerie|brokkoli|zucchini|apfelsine|mandarine|pfirsich|nektarine|kirsche|avocado|aubergine|spinat|kohl|linsen|bohne|erbse|mais|ananas|mango|spargel|ingwer|kräuter|petersilie|basilikum/i.test(l)) return 'Obst & Gemüse';
                            if (/brot|brötchen|eier|kuchen|mehl|zucker|hefe|toast|croissant|brezel|baguette|backpulver|torte|teig|vanillezucker|pfannkuchen|waffel|breze|\bei\b/i.test(l)) return 'Eier & Backwaren';
                            if (/milch|käse|quark|joghurt|butter|sahne|frischkäse|mozzarella|feta|gouda|pudding|margarine|parmesan|creme fraiche|emmentaler|camembert|mascarpone|ricotta|schmand|eiweiß/i.test(l)) return 'Kühlregal & Käse';
                            if (/wurst|fleisch|schinken|salami|hack|hähnchen|speck|schnitzel|steak|aufschnitt|pute|rind|schwein|lamm|bratwurst|würstchen|fisch|lachs|thunfisch|garnele|cevapcici|kaviar|sushi|forelle/i.test(l)) return 'Fleisch & Fisch';
                            if (/nudel|reis|ketchup|senf|soße|sosse|dose|müsli|haferflocken|öl|oel|essig|gewürz|salz|pfeffer|konserve|pesto|tomaten|suppe|brühe|honig|marmelade|nutella|aufstrich|mayo|sirup|chia|samen|kerne|maggi/i.test(l)) return 'Vorrat & Nährmittel';
                            if (/chips|schoko|keks|eis|süß|gummibär|nuss|riegel|popcorn|flips|nachos|praline|bonbon|kaugummi|mandel|cashew|pistazie|haribo|snickers|twix|mars/i.test(l)) return 'Snacks & Süßes';
                            if (/wasser|bier|wein|cola|saft|limo|kaffee|tee|sprudel|schorle|getränk|energy|sekt|sprit|fanta|sprite/i.test(l)) return 'Getränke';
                            return 'Sonstiges';
                        };

                        const rawLines = decodeURIComponent(itemsParam).split('\n');
                        const newItems = [];
                        const tUser = userParam ? decodeURIComponent(userParam).trim() : 'KI Scanner';
                        const generateId = () => Math.floor(100000 + Math.random() * 900000).toString();

                        rawLines.forEach(line => {
                            let t = line.replace(/^[-*•]\s*/, '').replace(/^\d+[\.)]\s+/, '').trim();
                            if (t) {
                                let itemName = t;
                                let itemAmount = '';
                                
                                const trailMatch = t.match(/\s+(\d+(?:[.,]\d+)?)\s*(x|kg|g|l|ml|pkg|pack|packung|stk|stück|flaschen|flasche|dosen|dose)?$/i);
                                const leadMatch = t.match(/^(\d+(?:[.,]\d+)?)\s*(x|kg|g|l|ml|pkg|pack|packung|stk|stück|flaschen|flasche|dosen|dose)?\s+(.+)$/i);
                                
                                if (trailMatch) {
                                    itemName = t.substring(0, t.length - trailMatch[0].length).trim();
                                    itemAmount = `${trailMatch[1]} ${trailMatch[2] || ''}`.trim();
                                } else if (leadMatch) {
                                    itemName = leadMatch[3].trim();
                                    itemAmount = `${leadMatch[1]} ${leadMatch[2] || ''}`.trim();
                                }
                                
                                newItems.push({ id: generateId(), name: itemName, amount: itemAmount, notes: '', category: getCat(itemName.toLowerCase()), addedBy: tUser, checked: false, timestamp: new Date().toISOString() });
                            }
                        });

                        if (newItems.length > 0) {
                            let lists = data.shoppingLists || [];
                            const tName = listNameParam ? decodeURIComponent(listNameParam).trim() : 'Einkauf (KI)';
                            let targetList = lists.find(l => l.name.trim().toLowerCase() === tName.toLowerCase());

                            if (!targetList) {
                                targetList = { id: generateId(), name: tName, sharedWith: [tUser], createdBy: tUser, items: [], isShoppingActive: false, timestamp: new Date().toISOString() };
                                lists.push(targetList);
                            }
                            targetList.items = [...(targetList.items || []), ...newItems];
                            await docRef.update({ shoppingLists: lists });
                            document.body.innerHTML = `<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#34C759;font-family:sans-serif;font-size:22px;font-weight:bold;">${newItems.length} Artikel importiert! 🛒✅</div>`;
                        } else {
                            document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#FF3B30;font-family:sans-serif;font-size:22px;font-weight:bold;">Keine Artikel gefunden ❌</div>';
                        }
                    }
                } catch (e) {
                    document.body.innerHTML = '<div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#000;color:#FF3B30;font-family:sans-serif;font-size:22px;font-weight:bold;">Verbindungsfehler ❌</div>';
                }
                setTimeout(() => {
                    if (window.webkit && window.webkit.messageHandlers) window.webkit.messageHandlers.close.postMessage("");
                    window.close();
                }, 1500);
            });
        }
    </script>

    <style>
        :root { --app-bg: #F2F2F7; }
        @media(prefers-color-scheme:dark) { :root { --app-bg: #000000; } }
        html { background-color: var(--app-bg); height: 100vh; width: 100vw; overflow: hidden; }
        body { margin: 0; padding: 0; background-color: var(--app-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior-y: none; height: 100%; width: 100%; }
        .scrollable-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(120px + env(safe-area-inset-bottom, 20px)); }
        .scrollable-area::-webkit-scrollbar { display: none; }
        .ios-blur { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        @media(prefers-color-scheme:dark) { .ios-blur { background: rgba(28, 28, 30, 0.85); } }
        .pt-safe-top { padding-top: max(env(safe-area-inset-top), 24px); }
        input[type="file"] { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="datetime-local"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
        input[type="datetime-local"] { max-width: 100%; box-sizing: border-box; display: block; width: 100%; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-action-sheet { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .custom-checkbox:checked+div { background-color: #34C759; border-color: #34C759; }
        .custom-checkbox:checked+div svg { opacity: 1; }
        /* Switch */
        .toggle-checkbox:checked { right: 0; border-color: #34C759; }
        .toggle-checkbox:checked + .toggle-label { background-color: #34C759; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); border-color: white; }
    </style>
</head>

<body class="text-black dark:text-white antialiased flex justify-center w-full">
    <div id="root" class="w-full h-full relative flex flex-col"></div>

    <script type="text/babel">
        const STYLES = {
            card: "bg-white dark:bg-[#1C1C1E] rounded-[24px] shadow-sm border border-[#E5E5EA] dark:border-[#38383A] overflow-hidden",
            input: "w-full bg-[var(--app-bg)] dark:bg-[#2C2C2E] px-4 py-3.5 rounded-[12px] outline-none font-medium text-[16px] text-black dark:text-white box-border focus:ring-2 ring-[#007AFF]/20",
            btnPrimary: "w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm disabled:opacity-50",
            btnSecondary: "w-full py-3.5 rounded-[16px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-black dark:text-white font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm",
            btnDanger: "w-full py-3.5 rounded-[16px] bg-[#FF3B30]/10 text-[#FF3B30] font-bold text-[17px] active:scale-[0.98] transition-transform shadow-sm",
            modalOverlay: "fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 pb-8 sm:pb-4 bg-black/40 dark:bg-black/60 backdrop-blur-sm transition-opacity animate-in fade-in duration-300",
            modalContent: "bg-white dark:bg-[#1C1C1E] rounded-[32px] p-6 w-full max-w-sm shadow-2xl border border-[#E5E5EA] dark:border-[#38383A] overflow-hidden animate-action-sheet relative flex flex-col max-h-[90vh]",
            subTitle: "text-[13px] font-semibold text-[#8E8E93] uppercase tracking-widest mb-2 ml-2",
            listItem: "flex items-center justify-between bg-[var(--app-bg)] dark:bg-[#2C2C2E] p-3.5 rounded-[14px]"
        };

        const SHOPPING_CATEGORIES = ['Obst & Gemüse', 'Eier & Backwaren', 'Kühlregal & Käse', 'Fleisch & Fisch', 'Vorrat & Nährmittel', 'Snacks & Süßes', 'Haushalt & Drogerie', 'Getränke', 'Sonstiges'];
        
        const ALL_MODULES = {
            'shopping': { id: 'shopping', icon: 'ShoppingCart', label: 'Planung' },
            'household': { id: 'household', icon: 'Home', label: 'Haushalt' },
            'expenses': { id: 'expenses', icon: 'Euro', label: 'Auslagen' },
            'gifts': { id: 'gifts', icon: 'Gift', label: 'Geschenke' }
        };

        function getAutoCategory(i) {
            const l = i.toLowerCase();
            if (/scheuer|spül|wasch|seife|klo|papier|tuch|shampoo|deo|zahnpasta|müll|putz|creme|dusch|rasier|bürste|schwamm|reiniger|watte|windel|slipeinlage|tampon|binde|rolle|wc|lotion|pflegetücher|waschmittel|klobürste|zahnseide|hygiene/i.test(l)) return 'Haushalt & Drogerie';
            if (/apfel|äpfel|banan|tomate|gurke|obst|gemüse|salat|zwiebel|kartoffel|knoblauch|beere|traube|paprika|möhre|karotte|pilz|zitrone|orange|birne|birnen|pflaume|melone|kiwi|kürbis|lauch|sellerie|brokkoli|zucchini|apfelsine|mandarine|pfirsich|nektarine|kirsche|avocado|aubergine|spinat|kohl|linsen|bohne|erbse|mais|ananas|mango|spargel|ingwer|kräuter|petersilie|basilikum/i.test(l)) return 'Obst & Gemüse';
            if (/brot|brötchen|eier|kuchen|mehl|zucker|hefe|toast|croissant|brezel|baguette|backpulver|torte|teig|vanillezucker|pfannkuchen|waffel|breze|\bei\b/i.test(l)) return 'Eier & Backwaren';
            if (/milch|käse|quark|joghurt|butter|sahne|frischkäse|mozzarella|feta|gouda|pudding|margarine|parmesan|creme fraiche|emmentaler|camembert|mascarpone|ricotta|schmand|eiweiß/i.test(l)) return 'Kühlregal & Käse';
            if (/wurst|fleisch|schinken|salami|hack|hähnchen|speck|schnitzel|steak|aufschnitt|pute|rind|schwein|lamm|bratwurst|würstchen|fisch|lachs|thunfisch|garnele|cevapcici|kaviar|sushi|forelle/i.test(l)) return 'Fleisch & Fisch';
            if (/nudel|reis|ketchup|senf|soße|sosse|dose|müsli|haferflocken|öl|oel|essig|gewürz|salz|pfeffer|konserve|pesto|tomaten|suppe|brühe|honig|marmelade|nutella|aufstrich|mayo|sirup|chia|samen|kerne|maggi/i.test(l)) return 'Vorrat & Nährmittel';
            if (/chips|schoko|keks|eis|süß|gummibär|nuss|riegel|popcorn|flips|nachos|praline|bonbon|kaugummi|mandel|cashew|pistazie|haribo|snickers|twix|mars/i.test(l)) return 'Snacks & Süßes';
            if (/wasser|bier|wein|cola|saft|limo|kaffee|tee|sprudel|schorle|getränk|energy|sekt|sprit|fanta|sprite/i.test(l)) return 'Getränke';
            return 'Sonstiges';
        }
        function generateId() { return Math.floor(100000 + Math.random() * 900000).toString(); }
        function getLocalTodayString() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
        function getLocalIsoString(addHours) { const d = new Date(); d.setHours(d.getHours() + addHours); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
        function formatTime(ts) { if (!ts) return ''; const d = new Date(ts); return isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        function formatDate(ts) { if (!ts) return ''; const d = new Date(ts); return isNaN(d.getTime()) ? '' : d.toLocaleDateString('de-DE', { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit' }); }
        function getStatusColor(a) {
            if (!a) return 'text-[#8E8E93] dark:text-[#EBEBF5]/60';
            if (a.includes('sofort') || a.includes('Übernommen') || a.includes('Gelesen') || a.includes('Zugefügt') || a.includes('Bin dabei')) return 'text-[#34C759]';
            if (a.includes('5 Minuten')) return 'text-[#FF9500]';
            if (a.includes('Fangt') || a.includes('Abgelehnt')) return 'text-[#FF3B30]';
            return 'text-[#34C759]';
        }
        function isExpired(ts, mx = 5) { if (!ts) return true; const t = new Date(ts).getTime(); if (isNaN(t)) return true; return (Date.now() - t) > mx * 60 * 1000; }
        function getCleanHistory(hist) { return (hist || []).filter(h => { if (h.isExpense || h.isHousehold || h.isSystemReminder || h.isCustomPush || h.isSwapRequest || h.isSuccessfulSwap || h.isRejectedSwap || h.isPaymentVerification || h.isSettlement || h.isGiftInvite) return true; return !isExpired(h.timestamp, 5); }).slice(0, 50); }
        function getSharedWith(obj) { return Array.isArray(obj?.sharedWith) ? obj.sharedWith : (obj?.sharedWith ? [obj.sharedWith] : ['Alle']); }
        function getNextSaturday() { const d = new Date(); const diff = (6 - d.getDay() + 7) % 7; d.setDate(d.getDate() + diff); return d.toISOString().split('T')[0]; }
        function getWeekNumber(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil((((d - ys) / 86400000) + 1) / 7); }
        function getDaysLeft(dateStr) { 
            const today = new Date(); today.setHours(0,0,0,0); 
            const d = new Date(dateStr); d.setHours(0,0,0,0);
            return Math.round((d - today) / (1000 * 60 * 60 * 24)); 
        }
        function safeFormatDateTime(ts) { if (!ts) return ''; const d = new Date(ts); if (isNaN(d.getTime())) return ''; return `am ${d.toLocaleDateString('de-DE')} um ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} Uhr`; }

        const urlify = (text) => {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.split(urlRegex).map((part, i) => {
                if(part.match(urlRegex)) {
                    return <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-[#007AFF] underline" onClick={(e) => e.stopPropagation()}>{part}</a>;
                }
                return part;
            });
        };

        try {
            const p = new URLSearchParams(window.location.search);
            const c = p.get('cfg');
            if (c) {
                const d = JSON.parse(decodeURIComponent(escape(atob(c))));
                localStorage.setItem('familyConnectAppConfig', JSON.stringify(d));
                localStorage.setItem('firebaseConfig', JSON.stringify(d));
            }
        } catch (e) { }

        const origErr = console.error;
        console.error = function (...a) { origErr.apply(console, a); };
        window.addEventListener('error', () => { });
        window.addEventListener('unhandledrejection', (e) => { if (e.reason && e.reason.toString().includes('Database deleted')) e.preventDefault(); });

        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        const CONFIG_STORAGE_KEY = "familyConnectAppConfig";

                    hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: currentUser.name, reason: `Die Abstimmung für das Geschenk von ${p.name} läuft!`, targets: ev.participants.filter(x => x !== currentUser.name), acknowledgedBy: [], isCustomPush: true, category: 'gift' });

                    uE = uE.map(e => e.id === eId ? { ...e, ideas: e.ideas.map(i => i.id === payload ? { ...i, votes: i.votes.includes(currentUser.name) ? i.votes.filter(x => x !== currentUser.name) : [...i.votes, currentUser.name] } : i) } : e);
                } else if (action === 'end_vote') {
                    let maxV = -1; let win = '';
                    ev.ideas.forEach(i => { if (i.votes.length > maxV) { maxV = i.votes.length; win = i.text; } });
                    uE = uE.map(e => e.id === eId ? { ...e, status: 'buying' } : e);
                    hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: 'System', reason: `Abstimmung beendet! Favorit für ${p.name}: ${win || 'Keine'}. Wer besorgt es?`, targets: ev.participants.filter(x => x !== currentUser.name), acknowledgedBy: [], isCustomPush: true, category: 'gift' });
                } else if (action === 'claim_buy') {
                    uE = uE.map(e => e.id === eId ? { ...e, buyer: currentUser.name } : e);
                    hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: 'System', reason: `${currentUser.name} besorgt das Geschenk für ${p.name}!`, targets: ev.participants.filter(x => x !== currentUser.name), acknowledgedBy: [], isCustomPush: true, category: 'gift' });
                } else if (action === 'settle') {
                    const amt = parseFloat(payload.amount.replace(',', '.'));
                    const extCount = parseInt(payload.extCount || '0', 10);
                    const totalP = ev.participants.length + extCount;
                    
                    let nE = [...safeExpenses];
                    if (totalP > 1 && amt > 0) {
                        const perP = (amt / totalP).toFixed(2);
                        ev.participants.forEach(mem => {
                            if (mem !== currentUser.name) {
                                nE.unshift({ id: generateId(), creditor: currentUser.name, debtor: mem, amount: perP, reason: `Geschenk für ${p.name}`, date: getLocalTodayString(), timestamp: new Date().toISOString(), isPaid: false });
                                hUpd.push({ id: generateId(), timestamp: new Date().toISOString(), sender: currentUser.name, reason: `Geschenk-Anteil für ${p.name}: ${perP}€`, targets: [mem], acknowledgedBy: [], isExpense: true });
                            }
                        });
                    }
                    uE = uE.map(e => e.id === eId ? { ...e, status: 'settled', cost: amt } : e);
                    await getFamilyDocRef(currentFamily.id).update({ giftEvents: uE, expenses: nE, history: [...hUpd, ...getCleanHistory(safeHistory)] });
                    setGiftsView('list'); setActiveGiftEventId(null);
                    return;
                }

                const updates = { giftEvents: uE };
                if (hUpd.length > 0) updates.history = [...hUpd, ...getCleanHistory(safeHistory)];
                await getFamilyDocRef(currentFamily.id).update(updates);
            };

            const syncCalendar = async (url) => {
                if(!url) return;
                try {
                    let fetchUrl = url;
                    if (fetchUrl.startsWith('webcal://')) fetchUrl = fetchUrl.replace('webcal://', 'https://');
                    
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(fetchUrl)}`);
                    const data = await res.json();
                    const icsData = data.contents;
                    if(!icsData) throw new Error("No contents");
                    
                    const lines = icsData.split(/\r?\n/);
                    let inEvent = false;
                    let summary = '';
                    let dtstart = '';
                    let newPersons = [...safeGiftPersons];
                    let changed = false;
                    
                    for(let line of lines) {
                        if (line.includes('BEGIN:VEVENT')) inEvent = true;
                        if (line.includes('END:VEVENT')) {
                            inEvent = false;
                            if (summary && dtstart) {
                                const match = summary.match(/(.*?)s?\s+Geburtstag/i) || summary.match(/(.*?)\s+Geburtstag/i);
                                if (match) {
                                    const name = match[1].trim();
                                    const dStr = dtstart.length >= 8 ? `${dtstart.substring(0,4)}-${dtstart.substring(4,6)}-${dtstart.substring(6,8)}` : '';
                                    if(dStr) {
                                        let p = newPersons.find(x => x.name.toLowerCase() === name.toLowerCase());
                                        if (!p) {
                                            p = { id: generateId(), name: name, type: 'family', birthdate: dStr, nameday: '', birthdayNeedsGift: true, namedayNeedsGift: false, christmasNeedsGift: true, easterNeedsGift: false };
                                            newPersons.push(p);
                                            changed = true;
                                        } else {
                                            if(p.birthdate !== dStr) { p.birthdate = dStr; changed = true; }
                                        }
                                    }
                                }
                            }
                            summary = ''; dtstart = '';
                        }
                        if (inEvent) {
                            if (line.startsWith('SUMMARY:')) summary = line.substring(8);
                            if (line.startsWith('DTSTART')) { const parts = line.split(':'); if(parts.length > 1) dtstart = parts[1]; }
                        }
                    }
                    if(changed) {
                        await getFamilyDocRef(currentFamily.id).update({ giftPersons: newPersons, lastCalSync: new Date().toISOString() });
                        showAlert('Erfolg', 'Kalender synchronisiert & Personen aktualisiert!');
                    } else {
                        await getFamilyDocRef(currentFamily.id).update({ lastCalSync: new Date().toISOString() });
                        showAlert('Hinweis', 'Kalender gescannt, keine neuen Geburtstage gefunden.');
                    }
                } catch(e) { 
                    showAlert('Fehler', 'Konnte Kalender nicht laden. Überprüfe den Link.'); 
                }
            };

            const renderGiftEventView = () => {
                const e = safeGiftEvents.find(x => x.id === activeGiftEventId);
                const p = safeGiftPersons.find(x => x.id === e?.personId);
                if (!e || !p) return null;
                const isPart = e.participants.includes(currentUser.name);
                const isNeedGift = e.type === 'birthdate' ? p.birthdayNeedsGift : 
                                   e.type === 'nameday' ? p.namedayNeedsGift :
                                   e.type === 'christmas' ? p.christmasNeedsGift : p.easterNeedsGift;
                
                let titleStr = '';
                if(e.type === 'birthdate') titleStr = `Geburtstag`;
                if(e.type === 'nameday') titleStr = `Namenstag`;
                if(e.type === 'christmas') titleStr = `Weihnachten`;
                if(e.type === 'easter') titleStr = `Ostern`;

                return (
                    <div className="absolute inset-0 bg-[var(--app-bg)] dark:bg-black z-50 flex flex-col animate-in slide-in-from-right duration-300">
                        <header className="pt-safe-top pb-4 px-4 bg-white/80 dark:bg-[#1C1C1E]/80 ios-blur flex items-center justify-between border-b border-[#E5E5EA] dark:border-[#38383A] z-10 shadow-sm">
                            <button onClick={() => { setActiveGiftEventId(null); if (!activeHoliday) setGiftsView('list'); }} className="text-[#007AFF] p-1 flex items-center"><Icon name="ChevronRight" size={24} className="rotate-180" /></button>
                            <h2 className="font-bold text-[18px] truncate">{titleStr} von {p.name}</h2>
                            <div className="w-8"></div>
                        </header>
                        <main className="flex-1 overflow-y-auto p-4 space-y-6 pb-20">
                            <div className="text-center">
                                <Icon name={e.type==='birthdate'?'Cake':e.type==='christmas'?'TreePine':e.type==='easter'?'Egg':'Gift'} size={48} className={`mx-auto mb-2 ${e.type==='birthdate'?'text-[#AF52DE]':e.type==='christmas'?'text-[#34C759]':e.type==='easter'?'text-[#007AFF]':'text-[#FF9500]'}`} />
                                <p className="text-[20px] font-bold">{formatDate(e.date)}</p>
                                <p className="text-[#8E8E93] text-[15px] font-medium">{getDaysLeft(e.date) === 0 ? 'Heute!' : `in ${getDaysLeft(e.date)} Tagen`}</p>
                            </div>

                            {!isNeedGift ? (
                                <div className="bg-[#007AFF]/10 p-5 rounded-[16px] text-center border border-[#007AFF]/20">
                                    <Icon name="Bell" size={24} className="text-[#007AFF] mx-auto mb-2" />
                                    <p className="text-[#007AFF] font-medium">Dies ist nur eine Erinnerung. Es ist kein Geschenk geplant.</p>
                                </div>
                            ) : (
                                <>
                                    {(!isPart && e.participants.length === 0) && (
                                        <div className={STYLES.card + " p-5 text-center"}>
                                            <h3 className="font-bold text-[18px] mb-4">Geschenk planen</h3>
                                            <div className="flex flex-col gap-3">
                                                <button onClick={() => handleGiftAction(e.id, 'join_alone')} className={STYLES.btnPrimary}>Allein schenken</button>
                                                <button onClick={() => {
                                                    setModal({ type: 'gift_invite_sel', activeMembersList, currentUser, selected: [], onConfirm: (sel) => { handleGiftAction(e.id, 'invite', sel); setModal(null); }, onClose: () => setModal(null) });
                                                }} className={STYLES.btnSecondary + " !bg-[#AF52DE]/10 !text-[#AF52DE]"}>Zusammen schenken</button>
                                            </div>
                                        </div>
                                    )}
                                    {(!isPart && e.participants.length > 0) && (
                                        <div className={STYLES.card + " p-5 text-center"}>
                                            <p className="mb-4 text-[#8E8E93]">Geplant von: {e.participants.join(', ')}</p>
                                            {e.pendingParticipants.includes(currentUser.name) ? (
                                                <button onClick={() => {
                                                    const uE = safeGiftEvents.map(x => x.id === e.id ? { ...x, participants: [...x.participants, currentUser.name], pendingParticipants: x.pendingParticipants.filter(y => y !== currentUser.name) } : x);
                                                    getFamilyDocRef(currentFamily.id).update({ giftEvents: uE });
                                                }} className={STYLES.btnPrimary}>Einladung annehmen</button>
                                            ) : (
                                                <p className="font-semibold text-[#FF9500]">Du bist nicht beteiligt.</p>
                                            )}
                                        </div>
                                    )}
                                    {isPart && (
                                        <>
                                            <div className="bg-white dark:bg-[#1C1C1E] p-4 rounded-[16px] border border-[#E5E5EA] dark:border-[#38383A]">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h3 className="font-bold text-[16px] flex items-center gap-2"><Icon name="Users" size={16} /> Beteiligte</h3>
                                                    <button onClick={() => {
                                                        setModal({ type: 'gift_invite_sel', activeMembersList, currentUser, selected: [], onConfirm: (sel) => { handleGiftAction(e.id, 'invite', sel); setModal(null); }, onClose: () => setModal(null) });
                                                    }} className="text-[#007AFF] text-[12px] font-bold">Einladen</button>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    {e.participants.map(pm => (
                                                        <span key={pm} className="bg-[#F2F2F7] dark:bg-[#2C2C2E] px-3 py-1 rounded-full text-[13px] font-medium flex items-center gap-1">{pm} {pm !== currentUser.name && <button onClick={() => showConfirm("Entfernen", `${pm} entfernen?`, () => handleGiftAction(e.id, 'remove_participant', pm), true)} className="text-[#FF3B30] ml-1"><Icon name="X" size={12}/></button>}</span>
                                                    ))}
                                                    {e.pendingParticipants.map(pm => (
                                                        <span key={pm} className="bg-[#FF9500]/10 text-[#FF9500] px-3 py-1 rounded-full text-[13px] font-medium flex items-center gap-1">
                                                            Wartet: {pm}
                                                            <button onClick={() => showConfirm("Entfernen", `Einladung für ${pm} zurückziehen?`, () => handleGiftAction(e.id, 'remove_pending', pm), true)} className="text-[#FF3B30] ml-1"><Icon name="X" size={12}/></button>
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            {e.status === 'planning' && (
                                                <div className={STYLES.card + " p-5"}>
                                                    <h3 className="font-bold text-[18px] mb-4">Ideen Sammlung</h3>
                                                    <div className="space-y-3 mb-5">
                                                        {e.ideas.length === 0 ? <p className="text-[#8E8E93] text-[14px] italic">Noch keine Ideen.</p> : e.ideas.map(i => (
                                                            <div key={i.id} className="p-3 bg-[#F2F2F7] dark:bg-[#2C2C2E] rounded-[12px] relative group cursor-pointer" onClick={() => {
                                                                if(i.addedBy === currentUser.name) {
                                                                    setModal({ type: 'confirm', title: 'Idee bearbeiten', message: 'Möchtest du die Idee bearbeiten oder löschen?', confirmText: 'Bearbeiten', cancelText: 'Löschen', onConfirm: () => { setModal(null); handleGiftAction(e.id, 'edit_idea', i.id); }, onCancel: () => { setModal(null); handleGiftAction(e.id, 'delete_idea', i.id); } });
                                                                }
                                                            }}>
                                                                <p className="font-semibold text-[15px]">{urlify(i.text)}</p>
                                                                <p className="text-[11px] text-[#8E8E93] mt-1">von {i.addedBy}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input type="text" placeholder="Neue Idee (auch Links)..." className={STYLES.input} value={newGiftIdea} onChange={ev => setNewGiftIdea(ev.target.value)} />
                                                        <button onClick={() => { if (newGiftIdea.trim()) { handleGiftAction(e.id, 'add_idea', newGiftIdea.trim()); setNewGiftIdea(''); } }} className="bg-[#AF52DE] text-white px-4 rounded-[12px]"><Icon name="Plus" size={20} /></button>
                                                    </div>
                                                    {e.ideas.length > 0 && e.participants.length > 1 && (
                                                        <button onClick={() => handleGiftAction(e.id, 'start_vote', null)} className="w-full mt-5 py-3 rounded-[12px] font-bold text-[15px] bg-[#007AFF]/10 text-[#007AFF]">Abstimmung starten</button>
                                                    )}
                                                </div>
                                            )}

                                            {e.status === 'voting' && (
                                                <div className={STYLES.card + " p-5 border-[#007AFF] border-2"}>
                                                    <h3 className="font-bold text-[18px] mb-4 text-[#007AFF]">{e.participants.length === 1 ? 'Auswahl' : 'Abstimmung läuft'}</h3>
                                                    <div className="space-y-3 mb-5">
                                                        {e.ideas.map(i => {
                                                            const mV = i.votes.includes(currentUser.name);
                                                            return (
                                                                <div key={i.id} onClick={() => handleGiftAction(e.id, 'vote', i.id)} className={`flex justify-between items-center p-3 rounded-[12px] border cursor-pointer ${mV ? 'bg-[#007AFF]/10 border-[#007AFF]' : 'bg-[var(--app-bg)] dark:bg-[#2C2C2E] border-transparent'}`}>
                                                                    <div><p className="font-semibold">{urlify(i.text)}</p><p className="text-[12px] text-[#8E8E93]">{i.votes.length} Stimme(n)</p></div>
                                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${mV ? 'border-[#007AFF] bg-[#007AFF]' : 'border-[#C6C6C8]'}`}>{mV && <Icon name="Check" size={14} className="text-white" />}</div>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                    <button onClick={() => handleGiftAction(e.id, 'end_vote')} className="w-full py-3 rounded-[12px] font-bold text-[15px] bg-[#007AFF] text-white shadow-sm">{e.participants.length === 1 ? 'Auswahl bestätigen' : 'Abstimmung beenden'}</button>
                                                </div>
                                            )}

                                            {(e.status === 'buying' || e.status === 'settled' || (e.status === 'planning' && e.participants.length === 1)) && (
                                                <div className={STYLES.card + " p-5"}>
                                                    <h3 className="font-bold text-[18px] mb-4">Besorgung</h3>
                                                    {e.participants.length === 1 ? (
                                                        <div className="text-center">
                                                            <Icon name="ShoppingCart" size={32} className="mx-auto text-[#007AFF] mb-2" />
                                                            {e.status !== 'settled' && (
                                                                <div className="bg-[#F2F2F7] dark:bg-[#2C2C2E] p-4 rounded-[16px] text-left mt-4">
                                                                    <p className="font-bold mb-3">Kosten (optional)</p>
                                                                    <div className="space-y-3">
                                                                        <input type="text" inputMode="decimal" placeholder="Gesamtpreis in €" className={STYLES.input} value={giftBuyerAmount} onChange={ev => setGiftBuyerAmount(ev.target.value.replace(/[^0-9.,]/g, ''))} />
                                                                        <button onClick={() => handleGiftAction(e.id, 'settle', { amount: giftBuyerAmount||'0', extCount: '0' })} className={STYLES.btnPrimary}>Als erledigt markieren</button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                            {e.status === 'settled' && (
                                                                <p className="text-[#34C759] font-bold mt-2 flex justify-center items-center gap-1"><Icon name="CheckCircle2" size={18} /> Erledigt {e.cost > 0 && `(${e.cost}€)`}</p>
                                                            )}
                                                        </div>
                                                    ) : (
                                                        <>
                                                            {e.ideas.length > 0 && (
                                                                <div className="mb-4 p-3 bg-[#34C759]/10 rounded-[12px] border border-[#34C759]/30">
                                                                    <p className="text-[12px] text-[#34C759] font-bold uppercase mb-1">Favoriten</p>
                                                                    {(() => {
                                                                        let mx = -1; e.ideas.forEach(i => { if(i.votes.length > mx) mx = i.votes.length; });
                                                                        const favs = e.ideas.filter(i => i.votes.length === mx);
                                                                        return favs.map(f => <p key={f.id} className="font-semibold">{urlify(f.text)}</p>);
                                                                    })()}
                                                                </div>
                                                            )}
                                                            {!e.buyer ? (
                                                                <button onClick={() => handleGiftAction(e.id, 'claim_buy')} className="w-full py-4 rounded-[14px] bg-[#AF52DE] text-white font-bold text-[17px] shadow-sm">Ich besorge es!</button>
                                                            ) : (
                                                                <div className="text-center">
                                                                    <Icon name="ShoppingCart" size={32} className="mx-auto text-[#007AFF] mb-2" />
                                                                    <p className="font-medium text-[16px] mb-4"><span className="font-bold">{e.buyer}</span> besorgt das Geschenk.</p>
                                                                    
                                                                    {e.buyer === currentUser.name && !e.settled && e.status !== 'settled' && (
                                                                        <div className="bg-[#F2F2F7] dark:bg-[#2C2C2E] p-4 rounded-[16px] text-left">
                                                                            <p className="font-bold mb-3">{e.participants.length > 1 ? 'Kosten eintragen' : 'Kosten (optional)'}</p>
                                                                            <div className="space-y-3">
                                                                                <input type="text" inputMode="decimal" placeholder="Gesamtpreis in €" className={STYLES.input} value={giftBuyerAmount} onChange={ev => setGiftBuyerAmount(ev.target.value.replace(/[^0-9.,]/g, ''))} />
                                                                                {e.participants.length > 1 && (
                                                                                    <div>
                                                                                        <p className={STYLES.subTitle + " !ml-1"}>Zahlen externe Personen mit? (Anzahl)</p>
                                                                                        <input type="number" min="0" className={STYLES.input} value={giftBuyerExtCount} onChange={ev => setGiftBuyerExtCount(ev.target.value)} />
                                                                                    </div>
                                                                                )}
                                                                                <button onClick={() => { if(giftBuyerAmount || e.participants.length===1) handleGiftAction(e.id, 'settle', { amount: giftBuyerAmount||'0', extCount: giftBuyerExtCount }) }} className={STYLES.btnPrimary}>{e.participants.length > 1 ? 'Kosten aufteilen & buchen' : 'Als erledigt markieren'}</button>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    {e.status === 'settled' && (
                                                                        <p className="text-[#34C759] font-bold mt-2 flex justify-center items-center gap-1"><Icon name="CheckCircle2" size={18} /> Erledigt {e.cost > 0 && `(${e.cost}€)`}</p>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </>
                                                    )}
                                                </div>
                                            )}
                                        </>
                                    )}
                                </>
                            )}
                        </main>
                    </div>
                );
            };

            if (!appLoaded) return <div className="h-full w-full bg-[var(--app-bg)] flex flex-col items-center justify-center relative z-50"><Icon name="ShieldCheck" size={64} strokeWidth={1.5} className="text-[#007AFF] animate-pulse mb-4" /></div>;

            if (isAdminMode) {
                return (
                    <div className="h-full w-full bg-[var(--app-bg)] font-sans flex flex-col relative z-40 overflow-hidden">
                        <Modal data={modal} onClose={() => setModal(null)} />
                        <div className="flex-1 flex flex-col w-full max-w-5xl mx-auto relative h-full">
                            <header className="flex-none pt-safe-top pb-4 px-6 bg-white/80 dark:bg-[#1C1C1E]/80 ios-blur border-b border-[#E5E5EA] dark:border-[#38383A] z-40 flex justify-between items-end sticky top-0">
                                <h1 className="text-[28px] font-extrabold text-black dark:text-white tracking-tight leading-none mt-6">Admin-Dashboard</h1>
                                {currentUser ? (
                                    <button onClick={() => setIsAdminMode(false)} className="text-[#007AFF] font-bold active:opacity-70 bg-[#007AFF]/10 px-4 py-2 rounded-full text-[14px] flex items-center gap-1.5"><Icon name="LogOut" size={14} className="rotate-180" /> Zurück zum Account</button>
                                ) : (<button onClick={() => setIsAdminMode(false)} className="text-[#FF3B30] font-semibold active:opacity-70">Logout</button>)}
                            </header>
                            <main className="scrollable-area px-6 py-6 w-full">
                                <div className="max-w-4xl mx-auto space-y-8 pb-20">
                                    <section className={STYLES.card + " p-6"}><h2 className="text-[18px] font-bold mb-4 text-black dark:text-white">Neue Familie anlegen</h2><div className="flex flex-col sm:flex-row gap-3"><input type="text" placeholder="Name der Familie" className={STYLES.input + " sm:flex-1"} value={newFamilyName} onChange={e => setNewFamilyName(e.target.value)} /><button onClick={adminCreateFamily} className={STYLES.btnPrimary + " sm:w-auto px-6 !mt-0"}>Erstellen</button></div></section>
                                    <div className="space-y-6">
                                        {adminFamilies.map(fam => {
                                            const lSM = Array.isArray(fam.members) ? fam.members.filter(m => m && m.name) : []; const pD = adminPushData[fam.id] || { title: '', message: '' };
                                            return (
                                                <div key={fam.id} className={STYLES.card}>
                                                    <div className="p-5 bg-[#F9F9F9] dark:bg-[#2C2C2E] border-b border-[#E5E5EA] dark:border-[#38383A] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0"><div><h3 className="font-bold text-[20px] text-black dark:text-white">{fam.name}</h3><p className="text-[#8E8E93] dark:text-[#EBEBF5]/60 text-[13px] font-mono mt-1">ID: {fam.id}</p></div><div className="flex w-full sm:w-auto gap-2"><button onClick={() => generatePDF(fam)} className="flex-1 sm:flex-none justify-center bg-[#007AFF]/10 text-[#007AFF] px-4 py-2.5 rounded-full text-[13px] font-semibold flex items-center gap-1.5"><Icon name="FileText" size={14} /> PDF Info-Blatt</button><button onClick={() => adminDeleteFamily(fam.id)} className="bg-[#FF3B30]/10 text-[#FF3B30] w-10 h-10 sm:w-9 sm:h-9 rounded-full flex items-center justify-center shrink-0"><Icon name="Trash2" size={16} /></button></div></div>
                                                    <div className="p-5 border-b border-[#E5E5EA] dark:border-[#38383A]"><h4 className={STYLES.subTitle + " !ml-0"}>Rundruf senden</h4><div className="space-y-3"><input type="text" placeholder="Überschrift" className={STYLES.input} value={pD.title} onChange={e => setAdminPushData({ ...adminPushData, [fam.id]: { ...pD, title: e.target.value } })} /><textarea placeholder="Nachricht" rows="2" className={STYLES.input + " resize-none"} value={pD.message} onChange={e => setAdminPushData({ ...adminPushData, [fam.id]: { ...pD, message: e.target.value } })}></textarea><button disabled={isSending} onClick={() => handleSendAdminPush(fam)} className={STYLES.btnPrimary}>Als Push senden</button></div></div>
                                                    <div className="p-5 border-b border-[#E5E5EA] dark:border-[#38383A]"><h4 className={STYLES.subTitle + " !ml-0 flex items-center gap-2"}><Icon name="Smartphone" size={14} /> Apple Kurzbefehle anpassen</h4><div className="space-y-3"><input type="text" placeholder="Ruf-Kurzbefehl Link" className={STYLES.input} value={adminLinksState[fam.id]?.ruf || ''} onChange={e => setAdminLinksState({ ...adminLinksState, [fam.id]: { ...adminLinksState[fam.id], ruf: e.target.value } })} /><input type="text" placeholder="KI Scanner Link" className={STYLES.input} value={adminLinksState[fam.id]?.scanner || ''} onChange={e => setAdminLinksState({ ...adminLinksState, [fam.id]: { ...adminLinksState[fam.id], scanner: e.target.value } })} /><input type="text" placeholder="Film vorschlagen Link" className={STYLES.input} value={adminLinksState[fam.id]?.film || ''} onChange={e => setAdminLinksState({ ...adminLinksState, [fam.id]: { ...adminLinksState[fam.id], film: e.target.value } })} /><button onClick={async () => { await getFamilyDocRef(fam.id).update({ shortcutLinks: adminLinksState[fam.id] }); showAlert("Erfolg", "Links gespeichert!"); }} className={STYLES.btnPrimary}>Links speichern</button></div></div>
                                                    <div className="p-5"><h4 className={STYLES.subTitle + " !ml-0"}>Mitglieder</h4><div className="space-y-3 mb-5">{lSM.map(m => (<div key={m.name} className={STYLES.listItem}><div className="flex items-center gap-3"><span className="font-semibold text-[16px] text-black dark:text-white">{m.name}</span>{m.status === 'pending' ? <span className="bg-[#FF9500]/20 text-[#FF9500] text-[11px] font-bold px-2 py-0.5 rounded-md uppercase">Ausstehend</span> : <span className="bg-[#34C759]/20 text-[#34C759] text-[11px] font-bold px-2 py-0.5 rounded-md uppercase">Aktiv</span>}</div><button onClick={() => adminDeleteMember(fam.id, m.name)} className="text-[#FF3B30] p-1"><Icon name="Trash2" size={18} /></button></div>))}</div><div className="flex flex-col sm:flex-row gap-3"><input type="text" placeholder="Neuer Vorname" className={STYLES.input + " sm:flex-1"} value={newMemberNames[fam.id] || ''} onChange={e => setNewMemberNames({ ...newMemberNames, [fam.id]: e.target.value })} /><button onClick={() => adminAddMember(fam)} className={STYLES.btnPrimary + " sm:w-auto px-6 !mt-0"}>Registrieren</button></div></div>
